<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Jeu Sandbox 3D</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">Utilisez ZQSD pour vous déplacer (Simulé) | Sandbox 3D Base</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- INITIALISATION ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Couleur ciel

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- LUMIÈRES ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // --- GÉNÉRATION DU MONDE (GRID) ---
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0x55aa55 });

        // Création d'un petit terrain de 10x10 cubes
        for (let x = -5; x < 5; x++) {
            for (let z = -5; z < 5; z++) {
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, 0, z);
                scene.add(cube);
            }
        }

        // --- POSITION CAMÉRA ---
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // --- BOUCLE D'ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Petit mouvement de caméra automatique pour simuler la vie
            const time = Date.now() * 0.001;
            camera.position.x = Math.sin(time * 0.5) * 12;
            camera.position.z = Math.cos(time * 0.5) * 12;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Gestion du redimensionnement
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
