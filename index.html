<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - GOD MODE ADMIN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 35px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; text-align: right; }
        #weapon-info { font-size: 14px; color: #fff; text-transform: uppercase; }
        
        #heli-ui { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,255,100,0.2); border: 1px solid #0f0; padding: 10px; display: none; color: #0f0; font-family: monospace; }
        
        #leaderboard { position: fixed; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); border: 1px solid #00d4ff; padding: 10px; width: 180px; font-family: monospace; z-index: 100; pointer-events: none; border-radius: 4px; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 14px; color: #00d4ff; border-bottom: 1px solid #00d4ff; padding-bottom: 5px; text-transform: uppercase; }
        .leader-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
        .is-me { color: #00d4ff; font-weight: bold; }

        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #00fff2; border-radius: 50%; pointer-events: none; box-shadow: 0 0 5px #00fff2; z-index: 21; }
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; background: radial-gradient(circle at center, #112 0%, #000 100%); }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 1px solid #00d4ff; text-align: center; border-radius: 5px; }
        button { padding: 15px 40px; background: linear-gradient(45deg, #00d4ff, #0088aa); border: none; font-weight: 900; letter-spacing: 2px; cursor: pointer; color: #000; text-transform: uppercase; }
        #kill-feed { position: absolute; top: 150px; right: 20px; text-align: right; font-size: 14px; font-weight: bold; font-family: monospace; z-index: 10; }
        .kill-item { background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; margin-bottom: 2px; border-right: 3px solid #00d4ff; animation: fadeout 4s forwards; }
        @keyframes fadeout { 0% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; } }
    </style>
</head>
<body>

<div id="login"><div class="box"><h1>NEON <span style="color:#00d4ff">CITY</span></h1><p style="color:#888; margin-bottom:20px;">GOD MODE ACTIVE</p><button id="btn-conn" onclick="connectToCloud()">DÉCOLLER</button></div></div>

<div id="ui">
    <div class="hud-panel"><div style="font-size:24px; font-weight:bold;">SCORE: <span id="score">0</span></div></div><br>
    <div class="hud-panel"><div>SANTÉ</div><div id="health-bar-bg"><div id="health-bar"></div></div></div>
</div>

<div id="leaderboard"><h3>Classement</h3><div id="leaderboard-list"></div></div>
<div id="heli-ui">PILOTAGE HÉLICO : ZSQD + ESPACE / SHIFT</div>
<div id="ammo-box"><div id="weapon-info">MITRAILLETTE</div><span id="ammo-val">50</span> / <span id="ammo-max">50</span></div>
<div id="kill-feed"></div>
<div id="crosshair"></div>

<script>
const KEYS_CONFIG = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0, pitch = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], bots = [];
let keysDown = {}, hp = 100, score = 0, lastShoot = 0, isAdmin = false;
let audioCtx, vy = 0, jumpCount = 0;
const GRAVITY = -55, JUMP_FORCE = 24;

// Système Hélico
let heliGroup, rotor, isPiloting = false, heliVelocity = new THREE.Vector3();

// Commande secrète console (F12) - Munitions Infinies + Immortalité
window.admin = function() {
    isAdmin = !isAdmin;
    if(isAdmin) {
        hp = 100; // Reset vie au max
        document.getElementById('health-bar').style.width = "100%";
        document.getElementById('ammo-val').textContent = "∞";
        document.getElementById('ammo-max').textContent = "∞";
        addKillFeed("SYSTEM", "GOD MODE ACTIVÉ");
        console.log("%c [ADMIN] MODE INVINCIBLE ET MUNITIONS INFINIES ACTIVÉ ", "background: #000; color: #00ff00; font-size: 15px; font-weight: bold;");
    } else {
        switchWeapon(currentWeaponIdx);
        console.log("%c [ADMIN] MODE NORMAL RÉTABLI ", "background: #000; color: #ff0000; font-size: 15px; font-weight: bold;");
    }
    return "Admin: " + isAdmin;
};

const WEAPONS = [
    { name: "Mitraillette", ammo: 50, maxAmmo: 50, rate: 80, dmg: 6, speed: 200, color: 0xff00cc, spread: 0.05, count: 1, size: 0.6 },
    { name: "Railgun", ammo: 5, maxAmmo: 5, rate: 1000, dmg: 85, speed: 400, color: 0xff00ff, spread: 0, count: 1, size: 1.2 }
];
let currentWeaponIdx = 0;

async function connectToCloud() {
    myID = "Ghost-" + Math.floor(Math.random()*999);
    initAudio(); 
    try {
        ably = new Ably.Realtime({ key: KEYS_CONFIG[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite');
            channel.subscribe('p', handleMessage);
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur connexion"); }
}

function handleMessage(m) {
    if (m.data.o === myID) return;
    const d = m.data;
    if (d.t === 'm') updateRemote(d);
    else if (d.t === 'f') createBullet(d);
    else if (d.t === 'h' && d.tgt === myID) takeDamage(d.dmg, d.o);
}

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function initGame() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02050a, 0.008);
    camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 2000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x02050a);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    
    buildStructuredCity();
    createHeli();
    
    playerGroup = createPlayerMesh(0x00d4ff, false); 
    playerGroup.position.set(0, 42, 0); 
    scene.add(playerGroup);
    
    setupInputs();
    loop();
}

function buildStructuredCity() {
    const grid = new THREE.GridHelper(2000, 100, 0x003366, 0x001122); scene.add(grid);
    for(let x = -5; x <= 5; x++) {
        for(let z = -5; z <= 5; z++) {
            if(Math.abs(x) < 1 && Math.abs(z) < 1) {
                createWall(0, 0, 0, 15, 15, 40, 0x0088ff);
                continue;
            }
            const posX = x * 40;
            const posZ = z * 40;
            const height = 20 + Math.random() * 60;
            const color = (x+z) % 2 === 0 ? 0x111122 : 0x050515;
            createWall(posX, 0, posZ, 25, 25, height, color);
            if(Math.random() > 0.7) createWall(posX, height, posZ, 26, 26, 1, 0x00ffcc);
        }
    }
}

function createHeli() {
    heliGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 5), new THREE.MeshStandardMaterial({color: 0x333333}));
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 4), new THREE.MeshStandardMaterial({color: 0x333333}));
    tail.position.z = -3;
    rotor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 0.4), new THREE.MeshStandardMaterial({color: 0x111111}));
    rotor.position.y = 1;
    heliGroup.add(body, tail, rotor);
    heliGroup.position.set(0, 41.5, -4);
    scene.add(heliGroup);
}

function createWall(x, y, z, w, d, h, color) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color })); 
    m.position.set(x, y + h/2, z); 
    scene.add(m);
    walls.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y, maxY: y+h });
}

function createPlayerMesh(col, withHb) {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), new THREE.MeshStandardMaterial({ color: col }));
    b.position.y = 0.9;
    g.add(b);
    return g;
}

function loop() {
    requestAnimationFrame(loop);
    const dt = 0.016;

    if(!isPiloting) {
        let moveSpeed = 35;
        const move = new THREE.Vector3();
        if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        
        if(move.length() > 0) {
            let s = move.normalize().multiplyScalar(moveSpeed * dt);
            playerGroup.position.x += s.x;
            playerGroup.position.z += s.z;
        }

        vy += GRAVITY * dt;
        playerGroup.position.y += vy * dt;
        let ground = getFloorY(playerGroup.position.x, playerGroup.position.z, playerGroup.position.y);
        if(playerGroup.position.y <= ground) { playerGroup.position.y = ground; vy = 0; jumpCount = 0; }
        
        camera.position.lerp(new THREE.Vector3(playerGroup.position.x - Math.sin(yaw)*12, playerGroup.position.y + 6, playerGroup.position.z - Math.cos(yaw)*12), 0.1);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2, playerGroup.position.z);
    } else {
        rotor.rotation.y += 0.5;
        if(keysDown['KeyW']) heliVelocity.z += Math.cos(heliGroup.rotation.y) * 1.5;
        if(keysDown['KeyS']) heliVelocity.z -= Math.cos(heliGroup.rotation.y) * 1.5;
        if(keysDown['KeyA']) heliGroup.rotation.y += 0.03;
        if(keysDown['KeyD']) heliGroup.rotation.y -= 0.03;
        if(keysDown['Space']) heliVelocity.y += 1.2;
        if(keysDown['ShiftLeft']) heliVelocity.y -= 1.2;
        
        heliVelocity.multiplyScalar(0.95);
        heliGroup.position.add(heliVelocity.clone().multiplyScalar(dt * 10));
        
        playerGroup.position.copy(heliGroup.position);
        camera.position.lerp(new THREE.Vector3(heliGroup.position.x - Math.sin(heliGroup.rotation.y)*25, heliGroup.position.y + 10, heliGroup.position.z - Math.cos(heliGroup.rotation.y)*25), 0.1);
        camera.lookAt(heliGroup.position);
    }

    renderer.render(scene, camera);
}

function getFloorY(x, z, currentY) {
    let floor = 0;
    for (let w of walls) {
        if (x > w.minX && x < w.maxX && z > w.minZ && z < w.maxZ) {
            if (currentY >= w.maxY - 1) floor = Math.max(floor, w.maxY);
        }
    }
    return floor;
}

function shoot() {
    const w = WEAPONS[currentWeaponIdx];
    if(!isAdmin && w.ammo <= 0) return;
    if(Date.now() - lastShoot < w.rate) return;
    lastShoot = Date.now();
    if(!isAdmin) { w.ammo--; document.getElementById('ammo-val').textContent = w.ammo; }

    const dir = isPiloting ? new THREE.Vector3(0,0,1).applyQuaternion(heliGroup.quaternion) : new THREE.Vector3(Math.sin(yaw), Math.sin(pitch), Math.cos(yaw));
    createBullet({ t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.5, z:playerGroup.position.z, dx:dir.x, dy:dir.y, dz:dir.z, spd:w.speed, dmg:w.dmg, col:w.color, sz:w.size });
}

function createBullet(d) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(d.sz, d.sz, d.sz*2), new THREE.MeshBasicMaterial({color:d.col}));
    m.position.set(d.x, d.y, d.z);
    m.lookAt(d.x+d.dx, d.y+d.dy, d.z+d.dz);
    scene.add(m);
    bullets.push({mesh:m, dir:new THREE.Vector3(d.dx, d.dy, d.dz), speed:d.spd});
}

function takeDamage(d, killer) { 
    if(isAdmin) return; // IMMORTALITÉ ACTIVÉE ICI
    hp -= d; 
    document.getElementById('health-bar').style.width = hp + "%"; 
    if(hp<=0) {
        hp = 100;
        playerGroup.position.set(0, 42, 0);
        document.getElementById('health-bar').style.width = "100%";
        addKillFeed(killer, "Toi");
    }
}

function addKillFeed(k,v) { 
    const d=document.createElement('div'); d.className='kill-item'; d.innerHTML=`${k} > ${v}`; 
    document.getElementById('kill-feed').prepend(d); 
}

function switchWeapon(i) { 
    currentWeaponIdx=i; 
    document.getElementById('weapon-info').textContent=WEAPONS[i].name;
    document.getElementById('ammo-val').textContent = isAdmin ? "∞" : WEAPONS[i].ammo;
    document.getElementById('ammo-max').textContent = isAdmin ? "∞" : WEAPONS[i].maxAmmo;
}

function setupInputs() {
    window.onkeydown=e=>{ 
        keysDown[e.code]=true;
        if(e.code==='KeyE') {
            const dist = playerGroup.position.distanceTo(heliGroup.position);
            if(dist < 5) {
                isPiloting = !isPiloting;
                document.getElementById('heli-ui').style.display = isPiloting ? 'block' : 'none';
                if(!isPiloting) playerGroup.position.y += 2;
            }
        }
        if(e.code==='Space' && !isPiloting) { if(jumpCount < 2) { vy = JUMP_FORCE; jumpCount++; } }
        if(e.code.startsWith('Digit')) switchWeapon(parseInt(e.code.slice(-1))-1);
    };
    window.onkeyup=e=>keysDown[e.code]=false;
    document.onmousemove=e=>{ if(document.pointerLockElement) yaw -= e.movementX * 0.003; };
    window.onmousedown=e=>{ if(document.pointerLockElement) shoot(); else renderer.domElement.requestPointerLock(); };
}
</script>
</body>
</html>
