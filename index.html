<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - AUTH OK</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 35px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; text-align: right; }
        
        #leaderboard { position: fixed; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); border: 1px solid #00d4ff; padding: 10px; width: 180px; font-family: monospace; z-index: 100; pointer-events: none; border-radius: 4px; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 14px; color: #00d4ff; border-bottom: 1px solid #00d4ff; padding-bottom: 5px; text-transform: uppercase; }
        .is-me { color: #00d4ff; font-weight: bold; }

        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 500; background: radial-gradient(circle at center, #112 0%, #000 100%); }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 1px solid #00d4ff; text-align: center; border-radius: 5px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); width: 350px; }
        #google-btn-container { margin-top: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .guest-link { color: #555; font-size: 11px; text-decoration: underline; cursor: pointer; }

        #pause-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(8px); }
        .menu-box { background: #0a0a15; border: 2px solid #00d4ff; padding: 40px; border-radius: 10px; text-align: center; }
        .menu-btn { width: 250px; display: block; margin: 15px auto; padding: 15px; background: linear-gradient(45deg, #00d4ff, #0088aa); border: none; font-weight: 900; cursor: pointer; color: #000; text-transform: uppercase; }

        #user-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        #user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #00d4ff; display: none; }
        #user-name { font-weight: bold; color: #00d4ff; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; border: 2px solid #00fff2; border-radius: 50%; pointer-events: none; z-index: 20; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h1 style="letter-spacing: 5px;">NEON <span style="color:#00d4ff">STRIKE</span></h1>
        <div id="google-btn-container">
            <div id="g_id_onload"
                 data-client_id="467950217263-7beh6tsp5nto8f2e1qpea0rsmgnlfr49.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-text="signin_with" data-shape="rectangular"></div>
            <div class="guest-link" onclick="guestLogin()">Mode Invité</div>
        </div>
    </div>
</div>

<div id="pause-menu">
    <div class="menu-box">
        <h2>PAUSE</h2>
        <button class="menu-btn" onclick="togglePause()">REPRENDRE</button>
        <button class="menu-btn" style="background: #444; color: #fff;" onclick="location.reload()">MENU PRINCIPAL</button>
    </div>
</div>

<div id="ui">
    <div class="hud-panel">
        <div id="user-profile">
            <img id="user-avatar" src="" alt="">
            <span id="user-name">Chargement...</span>
        </div>
        <div style="font-size:24px; font-weight:bold;">SCORE: <span id="score-val">0</span></div>
    </div><br>
    <div class="hud-panel"><div>SANTÉ</div><div id="health-bar-bg"><div id="health-bar"></div></div></div>
</div>

<div id="leaderboard">
    <h3>Classement</h3>
    <div id="leaderboard-list"></div>
</div>

<div id="ammo-box">
    <div style="font-size:12px; opacity:0.7">MITRAILLETTE</div>
    <span id="ammo-val">50</span> / 50
</div>

<div id="crosshair"></div>

<script>
const KEYS_CONFIG = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0;
let ably, channel, myID, myName = "Invité";
let otherPlayers = {}, bullets = [], keysDown = {}, hp = 100, score = 0, lastShoot = 0, isPaused = false;
let audioCtx, vy = 0, jumpCount = 0, isFiring = false;

function handleCredentialResponse(response) {
    try {
        const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        myName = payload.name;
        myID = "G-" + payload.sub.substring(0,8);
        document.getElementById('user-name').textContent = myName;
        const avatarImg = document.getElementById('user-avatar');
        avatarImg.src = payload.picture; avatarImg.style.display = 'block';
        connectToCloud();
    } catch(e) { guestLogin(); }
}

function guestLogin() {
    myID = "Guest-" + Math.floor(Math.random()*9999);
    myName = "Anonyme-" + myID.split('-')[1];
    document.getElementById('user-name').textContent = myName;
    connectToCloud();
}

async function connectToCloud() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try {
        ably = new Ably.Realtime({ key: KEYS_CONFIG[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite');
            channel.subscribe('p', (m) => {
                if (m.data.o === myID) return;
                if (m.data.t === 'm') updateRemote(m.data);
                if (m.data.t === 'f') createBullet(m.data);
            });
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur réseau Ably."); }
}

function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const grid = new THREE.GridHelper(1000, 100, 0x003366, 0x001122); scene.add(grid);
    
    playerGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({ color: 0x00d4ff }));
    playerGroup.add(body); playerGroup.position.y = 1; scene.add(playerGroup);
    
    setupInputs();
    loop();
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
    if(!isPaused) renderer.domElement.requestPointerLock();
    else document.exitPointerLock();
}

function setupInputs() {
    window.onkeydown = e => { if(e.code==='Escape') togglePause(); if(!isPaused) keysDown[e.code]=true; if(e.code==='Space') jump(); };
    window.onkeyup = e => keysDown[e.code]=false;
    document.onmousemove = e => { if(document.pointerLockElement && !isPaused) yaw -= e.movementX * 0.003; };
    window.onmousedown = () => { if(!isPaused) { if(document.pointerLockElement) isFiring=true; else renderer.domElement.requestPointerLock(); } };
    window.onmouseup = () => isFiring = false;
}

function shoot() {
    if(Date.now() - lastShoot < 150) return;
    lastShoot = Date.now();
    const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+0.5, z:playerGroup.position.z, dx:Math.sin(yaw), dy:0, dz:Math.cos(yaw), spd:150, col:0x00d4ff };
    channel.publish('p', d); createBullet(d);
}

function createBullet(d) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color:d.col}));
    m.position.set(d.x, d.y, d.z); scene.add(m);
    bullets.push({mesh:m, dir:new THREE.Vector3(d.dx, d.dy, d.dz), speed:d.spd, time:0});
}

function loop() {
    requestAnimationFrame(loop);
    if(!isPaused) {
        if(isFiring) shoot();
        const move = new THREE.Vector3();
        if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        playerGroup.position.add(move.normalize().multiplyScalar(0.4));
        
        vy -= 0.05; playerGroup.position.y += vy;
        if(playerGroup.position.y < 1) { playerGroup.position.y = 1; vy = 0; jumpCount = 0; }
        
        for(let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].mesh.position.addScaledVector(bullets[i].dir, bullets[i].speed * 0.016);
            bullets[i].time++; if(bullets[i].time > 100) { scene.remove(bullets[i].mesh); bullets.splice(i,1); }
        }
        
        channel.publish('p', { t:'m', o:myID, name:myName, x:playerGroup.position.x, y:playerGroup.position.y, z:playerGroup.position.z, ry:yaw, score });
    }
    camera.position.lerp(new THREE.Vector3(playerGroup.position.x - Math.sin(yaw)*10, playerGroup.position.y + 5, playerGroup.position.z - Math.cos(yaw)*10), 0.1);
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2, playerGroup.position.z);
    renderer.render(scene, camera);
}

function jump() { if(jumpCount < 2) { vy = 0.8; jumpCount++; } }
function updateRemote(d) { if(!otherPlayers[d.o]){ otherPlayers[d.o]=new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshStandardMaterial({color:0xff0055})); scene.add(otherPlayers[d.o]); } otherPlayers[d.o].position.set(d.x,d.y,d.z); }
</script>
</body>
</html>
