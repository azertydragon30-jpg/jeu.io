<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - MOBILE ULTIMATE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-touch-callout: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 40px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; }
        
        #sniper-scope { position: fixed; inset: 0; border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 1000px #000; border: 2px solid #555; background: radial-gradient(circle, transparent 30%, #000 80%); z-index: 20; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #00fff2; border-radius: 50%; pointer-events: none; box-shadow: 0 0 5px #00fff2; z-index: 21; }
        #hit-marker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 24px; height: 24px; border: 3px solid #ff0055; opacity: 0; transition: opacity 0.1s; pointer-events: none; border-left: none; border-top: none; z-index: 22; }
        
        #reload-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #ff0055; font-weight: bold; display: none; text-shadow: 0 0 10px red; animation: blink 0.3s infinite; z-index: 25; }
        @keyframes blink { 50% { opacity: 0; } }
        
        #kill-feed { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 16px; font-weight: bold; font-family: monospace; z-index: 10; }
        .kill-item { background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; margin-bottom: 2px; border-right: 3px solid #00d4ff; animation: fadeout 4s forwards; }
        @keyframes fadeout { 0% { opacity:1; transform:translateX(20px); } 10% { transform:translateX(0); } 80% { opacity:1; } 100% { opacity:0; display:none; } }

        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; background: radial-gradient(circle at center, #112 0%, #000 100%); }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 1px solid #00d4ff; text-align: center; border-radius: 5px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); }
        button { padding: 15px 40px; background: linear-gradient(45deg, #00d4ff, #0088aa); border: none; font-weight: 900; letter-spacing: 2px; cursor: pointer; color: #000; transition: transform 0.1s; text-transform: uppercase; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }

        .dmg-text { position: absolute; color: #ffcc00; font-weight: 900; font-size: 20px; pointer-events: none; text-shadow: 0 0 3px #000; animation: floatUp 1s forwards; z-index: 15; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }

        /* --- MOBILE CONTROLS --- */
        #mobile-controls { display: none; position: absolute; inset: 0; z-index: 50; pointer-events: none; }
        .touch-zone { position: absolute; bottom: 50px; width: 150px; height: 150px; pointer-events: auto; }
        #stick-container { left: 30px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; background: rgba(0,0,0,0.2); }
        #stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0, 212, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Look Zone (Right half of screen) */
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 40; }

        .mob-btn { position: absolute; width: 70px; height: 70px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation; user-select: none; }
        .mob-btn:active { background: #00d4ff; color: #000; transform: scale(0.95); }
        
        #btn-fire { bottom: 60px; right: 40px; width: 90px; height: 90px; border-color: #ff0055; background: rgba(255,0,85,0.2); font-size: 40px; z-index: 60; }
        #btn-jump { bottom: 180px; right: 40px; z-index: 60; }
        #btn-scope { bottom: 60px; right: 150px; font-size: 20px; z-index: 60; }
        #btn-reload { bottom: 180px; right: 130px; font-size: 20px; width: 50px; height: 50px; z-index: 60; }
    </style>
</head>
<body>

<div id="login"><div class="box"><h1>NEON <span style="color:#00d4ff">STRIKE</span></h1><p style="color:#888; margin-bottom:20px;">MOBILE CROSSPLAY</p><button id="btn-conn" onclick="connectToCloud()">DÉPLOIEMENT</button></div></div>

<div id="ui">
    <div class="hud-panel"><div style="font-size:24px; font-weight:bold;">SCORE: <span id="score">0</span></div></div><br>
    <div class="hud-panel"><div>SANTÉ</div><div id="health-bar-bg"><div id="health-bar"></div></div></div>
    <div class="hud-panel" style="margin-top:5px; font-size:12px; color:#aaa; display:block;" id="pc-help">[ESPACE] SAUT | [SHIFT] DASH | [C] CROUCH | [R] RELOAD</div>
</div>

<div id="ammo-box">30 / 30</div>
<div id="reload-msg">RECHARGEMENT...</div>
<div id="kill-feed"></div>
<div id="crosshair"></div>
<div id="sniper-scope"></div>
<div id="hit-marker"></div>
<div id="damage-container"></div>

<div id="mobile-controls">
    <div id="stick-container" class="touch-zone"><div id="stick"></div></div>
    <div id="look-zone"></div>
    <div id="btn-fire" class="mob-btn" ontouchstart="startFire(event)" ontouchend="stopFire(event)">🔥</div>
    <div id="btn-jump" class="mob-btn" ontouchstart="jump(event)">⬆️</div>
    <div id="btn-scope" class="mob-btn" ontouchstart="toggleScope(event)">🎯</div>
    <div id="btn-reload" class="mob-btn" ontouchstart="reload(event)">🔄</div>
</div>

<script>
const KEYS = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0, pitch = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], particles = [], walls = [], teleporters = [], bonuses = [], grenades = [], bots = [], floatingTexts = [];
let keysDown = {}, hp = 100, score = 0, ammo = 30;
let lastShoot = 0, lastDash = 0, lastSync = 0, lastTeleport = 0, lastGrenade = 0, shakeTime = 0;
let isReloading = false, isSniper = false, speedBoost = false;
let audioCtx; 
let vy = 0; const GRAVITY = -45; const JUMP_FORCE = 20; let canJump = false, jumpCount = 0;

// Variables Mobile
let isMobile = false;
let touchMove = { x: 0, y: 0 }; // Joystick gauche
let isFiring = false;

async function connectToCloud() {
    const btn = document.getElementById('btn-conn');
    btn.textContent = "CONNEXION..."; btn.disabled = true;
    checkMobile(); // Détection
    myID = "Ghost-" + Math.floor(Math.random()*999);
    initAudio(); 
    try {
        ably = new Ably.Realtime({ key: KEYS[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite');
            channel.subscribe('p', handleMessage);
            channel.presence.subscribe('leave', member => { removeRemote(member.clientId); });
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur: " + e.message); btn.disabled = false; }
}

function checkMobile() {
    isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800;
    if (isMobile) {
        document.getElementById('mobile-controls').style.display = 'block';
        document.getElementById('pc-help').style.display = 'none';
        setupTouchControls();
    }
}

function handleMessage(m) {
    if (m.data.o === myID) return;
    const d = m.data;
    if (d.t === 'm') updateRemote(d);
    else if (d.t === 'f') { createBullet(d); playSound('laser', 0.2); }
    else if (d.t === 'h' && d.tgt === myID) { takeDamage(d.dmg, d.o); playSound('hit', 0.5); }
    else if (d.t === 'k') addKillFeed(d.killer, d.victim);
}

function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type, vol=0.1) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='shoot') { osc.type='square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
    else if(type==='laser') { osc.type='sawtooth'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime+0.2); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.2); osc.start(); osc.stop(audioCtx.currentTime+0.2); }
    else if(type==='jump') { osc.type='sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime+0.1); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime+0.3); osc.start(); osc.stop(audioCtx.currentTime+0.3); }
    else if(type==='hit') { osc.type='sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
}

function initGame() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.012);
    camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000510);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const pLight = new THREE.PointLight(0x00d4ff, 1, 80); pLight.position.set(0, 50, 0); scene.add(pLight);
    
    const starsGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<1500; i++) starPos.push((Math.random()-0.5)*1000, (Math.random()-0.5)*1000 + 200, (Math.random()-0.5)*1000);
    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:0xffffff, size:1.8})));

    buildMap();
    playerGroup = createPlayerMesh(0x00d4ff);
    scene.add(playerGroup);
    
    for(let i=0; i<4; i++) spawnBot();
    setupInputs();
    loop();
}

function spawnBot() {
    const bot = { id: "Bot-" + Math.floor(Math.random()*1000), mesh: createPlayerMesh(0xffff00), hp: 80, lastShoot: 0, dir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize(), changeDirAt: Date.now() + 2000 };
    bot.mesh.position.set((Math.random()-0.5)*150, 0, (Math.random()-0.5)*150); scene.add(bot.mesh); bots.push(bot);
}

function createPlayerMesh(col) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.5 });
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), mat); b.position.y = 0.9;
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat); h.position.y = 2.1;
    const v = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.3), new THREE.MeshBasicMaterial({color:0x00ffff})); v.position.set(0, 2.1, 0.3);
    g.add(b, h, v); return g;
}

function buildMap() {
    const grid = new THREE.GridHelper(600, 120, 0x0033aa, 0x050510); scene.add(grid);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.05, side: THREE.DoubleSide })); glass.rotation.x = -Math.PI/2; glass.position.y = 29.9; scene.add(glass);
    for(let i=0; i<50; i++) {
        let x = (Math.random()-0.5)*280, z = (Math.random()-0.5)*280;
        if(Math.abs(x)<25 && Math.abs(z)<25) continue;
        createWall(x, 0, z, 10 + Math.random()*10, 10 + Math.random()*10, 8 + Math.random()*20);
    }
    createPad(0,0,0,30,0xd400ff); createBonus(30, 1, 30, 'heal'); createBonus(-30, 1, -30, 'speed');
}

function createWall(x, y, z, w, d, h) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.2, metalness: 0.8 })); m.position.set(x, y+h/2, z); 
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x0066aa, transparent: true, opacity:0.3 })); edges.position.copy(m.position); scene.add(m, edges);
    walls.push({ minX:x-w/2, maxX:x+w/2, minZ:z-d/2, maxZ:z+d/2, minY:y, maxY:y+h });
}
function createPad(x,y,z,ty,c) { const m = new THREE.Mesh(new THREE.CylinderGeometry(4,4,0.2,16), new THREE.MeshBasicMaterial({color:c})); m.position.set(x,y+0.1,z); scene.add(m); teleporters.push({x,y,z,ty,mesh:m}); }
function createBonus(x,y,z,t) { const c=t==='heal'?0xff0000:0xffff00; const m=new THREE.Mesh(new THREE.OctahedronGeometry(1), new THREE.MeshBasicMaterial({color:c,wireframe:true})); m.position.set(x,y,z); scene.add(m); bonuses.push({mesh:m,type:t,active:true}); }

function loop() {
    requestAnimationFrame(loop);
    const now = Date.now(), dt = 0.016;
    
    if(isFiring) shoot(); // Tir automatique si bouton appuyé

    // Bots logic
    bots.forEach((bot, index) => {
        if (now > bot.changeDirAt) { bot.dir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize(); bot.changeDirAt = now + 2000 + Math.random()*3000; }
        const nextX = bot.mesh.position.x + bot.dir.x * 12 * dt; const nextZ = bot.mesh.position.z + bot.dir.z * 12 * dt;
        if (!checkWall(nextX, 0, nextZ)) { bot.mesh.position.x = nextX; bot.mesh.position.z = nextZ; } else { bot.changeDirAt = 0; }
        bot.mesh.rotation.y = Math.atan2(bot.dir.x, bot.dir.z);
        if (bot.mesh.position.distanceTo(playerGroup.position) < 40 && now - bot.lastShoot > 1200) {
            bot.lastShoot = now; const shootDir = playerGroup.position.clone().sub(bot.mesh.position).normalize();
            const d = { t:'f', o:bot.id, x:bot.mesh.position.x, y:1.8, z:bot.mesh.position.z, dx:shootDir.x, dy:shootDir.y, dz:shootDir.z, spd:80, dmg:8, col:0xffaa00 }; createBullet(d);
        }
    });

    const isCrouch = keysDown['KeyC'] || keysDown['ControlLeft'];
    let moveSpeed = speedBoost ? 50 : 30;
    if(keysDown['ShiftLeft'] && now - lastDash > 1500) { lastDash = now; moveSpeed = 120; shakeTime = 5; playSound('jump', 0.1); }

    const move = new THREE.Vector3();
    
    // CLAVIER
    if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    
    // MOBILE JOYSTICK
    if(Math.abs(touchMove.x) > 0.1 || Math.abs(touchMove.y) > 0.1) {
        // Le joystick envoie un vecteur X/Y local. On doit le transformer selon l'angle yaw.
        // forward (y négatif sur écran) = cos(yaw)
        const strafe = touchMove.x * moveSpeed * dt;
        const forward = -touchMove.y * moveSpeed * dt;
        
        move.add(new THREE.Vector3(Math.sin(yaw) * forward, 0, Math.cos(yaw) * forward)); // Avancer
        move.add(new THREE.Vector3(Math.cos(yaw) * strafe, 0, -Math.sin(yaw) * strafe)); // Strafe
    }

    if(move.length() > 0 || (isMobile && (touchMove.x!==0 || touchMove.y!==0))) {
        // Normalisation seulement si clavier, car joystick gère déjà l'intensité
        let s = move;
        if(!isMobile) s = move.normalize().multiplyScalar(moveSpeed * dt);
        
        if(!checkWall(playerGroup.position.x+s.x, playerGroup.position.y, playerGroup.position.z)) playerGroup.position.x+=s.x;
        if(!checkWall(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z+s.z)) playerGroup.position.z+=s.z;
    }
    
    vy += GRAVITY * dt; playerGroup.position.y += vy * dt;
    if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; vy = 0; canJump = true; jumpCount = 0; }
    if(playerGroup.position.y > 0 && checkWall(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z)) { playerGroup.position.y -= vy * dt; vy = 0; }
    playerGroup.rotation.y = yaw;

    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * dt);
        if(checkWall(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z)) { createExplosion(b.mesh.position, b.col, 5); scene.remove(b.mesh); bullets.splice(i,1); continue; }
        if(b.o === myID) {
            bots.forEach((bot, botIdx) => {
                if(b.mesh.position.distanceTo(bot.mesh.position) < 2) {
                    bot.hp -= b.dmg; showDamageText(b.dmg, bot.mesh.position); triggerHitMarker(); playSound('hit'); scene.remove(b.mesh); bullets.splice(i,1);
                    if(bot.hp <= 0) { addKillFeed("Toi", "Bot Android"); createExplosion(bot.mesh.position, 0xffff00, 20); scene.remove(bot.mesh); bots.splice(botIdx, 1); setTimeout(spawnBot, 5000); }
                }
            });
        }
        if(b.o.startsWith("Bot-") && b.mesh.position.distanceTo(playerGroup.position) < 2) { takeDamage(b.dmg, b.o); scene.remove(b.mesh); bullets.splice(i,1); }
        if(b.o === myID) { for(let id in otherPlayers) { if(b.mesh.position.distanceTo(otherPlayers[id].mesh.position) < 2) { createExplosion(b.mesh.position, 0xff0000, 8); channel.publish('p', { t:'h', o:myID, tgt:id, dmg:b.dmg }); showDamageText(b.dmg, otherPlayers[id].mesh.position); triggerHitMarker(); scene.remove(b.mesh); bullets.splice(i,1); break; } } }
        if(bullets[i] && now > b.death) { scene.remove(b.mesh); bullets.splice(i,1); }
    }

    const camHeight = isCrouch ? 1 : (isSniper ? 1.8 : 8); const camDist = isSniper ? 0 : 12; const recoilOffset = (shakeTime > 0) ? (Math.random()*0.5) : 0;
    camera.position.lerp(new THREE.Vector3(playerGroup.position.x - Math.sin(yaw) * camDist, playerGroup.position.y + camHeight + recoilOffset, playerGroup.position.z - Math.cos(yaw) * camDist), 0.2);
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + (isCrouch?1:2) + recoilOffset*2, playerGroup.position.z);
    if(shakeTime > 0) shakeTime--;
    particles.forEach((p,i) => { p.mesh.position.add(p.vel); p.mesh.material.opacity-=0.05; if(p.mesh.material.opacity<=0){scene.remove(p.mesh); particles.splice(i,1)} });
    floatingTexts.forEach((ft, i) => { const pos = ft.pos.clone().project(camera); const x = (pos.x * .5 + .5) * window.innerWidth; const y = (-(pos.y * .5) + .5) * window.innerHeight; ft.el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`; if(Date.now() > ft.die) { ft.el.remove(); floatingTexts.splice(i, 1); } });
    if(now - lastSync > 100) { channel.publish('p', { t:'m', o:myID, x:playerGroup.position.x, y:playerGroup.position.y, z:playerGroup.position.z, ry:yaw }); lastSync = now; }
    renderer.render(scene, camera);
}

function shoot() {
    if(isReloading || ammo <= 0) { if(ammo<=0) reload(); return; }
    if(Date.now() - lastShoot < (isSniper ? 800 : 100)) return;
    lastShoot = Date.now(); ammo--; document.getElementById('ammo-box').textContent = ammo + " / 30";
    shakeTime = isSniper ? 8 : 4; camera.position.y += 0.5; playSound('shoot');
    const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.8, z:playerGroup.position.z, dx:Math.sin(yaw), dy:0, dz:Math.cos(yaw), spd:isSniper?250:150, dmg:isSniper?50:15, col:isSniper?0xff00ff:0x00ffcc };
    channel.publish('p', d); createBullet(d);
}

function jump(e) { if(e) e.preventDefault(); if (jumpCount < 2) { vy = JUMP_FORCE; jumpCount++; playSound('jump', 0.15); } }
function startFire(e) { e.preventDefault(); isFiring = true; shoot(); }
function stopFire(e) { e.preventDefault(); isFiring = false; }
function toggleScope(e) { if(e) e.preventDefault(); if(!isSniper) { isSniper=true; camera.fov=20; camera.updateProjectionMatrix(); document.getElementById('sniper-scope').style.display='block'; playerGroup.visible=false; } else { isSniper=false; camera.fov=80; camera.updateProjectionMatrix(); document.getElementById('sniper-scope').style.display='none'; playerGroup.visible=true; } }

function showDamageText(dmg, pos) { const el = document.createElement('div'); el.className = 'dmg-text'; el.textContent = "-" + dmg; document.body.appendChild(el); floatingTexts.push({ el: el, pos: pos.clone().add(new THREE.Vector3(0,2,0)), die: Date.now()+1000 }); }
function triggerHitMarker() { const hm = document.getElementById('hit-marker'); hm.style.opacity = 1; setTimeout(() => { hm.style.opacity = 0; }, 150); }
function reload(e) { if(e) e.preventDefault(); if(!isReloading){ isReloading=true; document.getElementById('reload-msg').style.display='block'; setTimeout(()=>{ammo=30;isReloading=false;document.getElementById('reload-msg').style.display='none';document.getElementById('ammo-box').textContent="30 / 30"},2000); } }
function createBullet(d) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.6), new THREE.MeshBasicMaterial({color:d.col})); m.position.set(d.x,d.y,d.z); m.lookAt(d.x+d.dx, d.y+d.dy, d.z+d.dz); scene.add(m); bullets.push({mesh:m, dir:new THREE.Vector3(d.dx,d.dy,d.dz), speed:d.spd, dmg:d.dmg, col:d.col, o:d.o, death:Date.now()+2000}); }
function createExplosion(p, c, count) { for(let i=0; i<count; i++) { const m=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshBasicMaterial({color:c})); m.position.copy(p); scene.add(m); particles.push({mesh:m, vel:new THREE.Vector3(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5)}); } }
function takeDamage(d, id) { hp-=d; document.getElementById('health-bar').style.width=Math.max(0,hp)+"%"; playSound('hit', 0.3); shakeTime=15; if(hp<=0) { hp=100; playerGroup.position.set(0,20,0); score=Math.max(0,score-50); document.getElementById('score').textContent=score; } }
function addKillFeed(k,v) { const d=document.createElement('div'); d.className='kill-item'; d.innerHTML=`<span style="color:#00d4ff">${k}</span> 🔪 <span style="color:#ff5500">${v}</span>`; document.getElementById('kill-feed').prepend(d); if(k==="Toi"){score+=100; document.getElementById('score').textContent=score;} }
function updateRemote(d) { if(!otherPlayers[d.o]) { otherPlayers[d.o]={mesh:createPlayerMesh(0xff0055)}; scene.add(otherPlayers[d.o].mesh); } otherPlayers[d.o].mesh.position.set(d.x,d.y,d.z); otherPlayers[d.o].mesh.rotation.y=d.ry; }
function removeRemote(id) { if(otherPlayers[id]) { scene.remove(otherPlayers[id].mesh); delete otherPlayers[id]; } }
function checkWall(x,y,z) { return walls.some(w => x>w.minX && x<w.maxX && z>w.minZ && z<w.maxZ && y>=w.minY && y<=w.maxY); }

function setupInputs() {
    window.onkeydown=e=>{ keysDown[e.code]=true; if(e.code==='KeyR') reload(); if(e.code==='Space') jump(); if(e.code==='ShiftLeft' && !isSniper) toggleScope(); }; 
    window.onkeyup=e=>keysDown[e.code]=false;
    // PC MOUSE LOOK
    document.onmousemove=e=>{ if(document.pointerLockElement) yaw-=e.movementX*(isSniper?0.001:0.003) };
    window.onmousedown=()=>{ if(!isMobile) { if(document.pointerLockElement) shoot(); else { renderer.domElement.requestPointerLock(); initAudio(); } } };
}

function setupTouchControls() {
    const stickZone = document.getElementById('stick-container');
    const stick = document.getElementById('stick');
    const lookZone = document.getElementById('look-zone');
    
    // JOYSTICK MOVE
    stickZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = stickZone.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        
        let dx = touch.clientX - cx;
        let dy = touch.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = 50;
        
        if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
        
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        touchMove = { x: dx/maxDist, y: dy/maxDist };
    });
    
    stickZone.addEventListener('touchend', (e) => {
        e.preventDefault();
        stick.style.transform = `translate(-50%, -50%)`;
        touchMove = { x: 0, y: 0 };
    });

    // TOUCH LOOK (Right side)
    let lastTouchX = 0;
    lookZone.addEventListener('touchstart', e => { lastTouchX = e.touches[0].clientX; });
    lookZone.addEventListener('touchmove', e => {
        e.preventDefault();
        const touchX = e.touches[0].clientX;
        const deltaX = touchX - lastTouchX;
        yaw -= deltaX * 0.005; // Sensibilité tactile
        lastTouchX = touchX;
    });
}
</script>
