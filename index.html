<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - ULTIMATE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.2s; }
        #kill-feed { position: absolute; top: 10px; right: 10px; text-align: right; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .feed-item { margin-bottom: 4px; opacity: 1; transition: opacity 1s; }
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .box { background: #111; padding: 40px; border: 2px solid #00d4ff; text-align: center; border-radius: 10px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
        button { padding: 15px 40px; background: #00d4ff; border: none; font-weight: 900; letter-spacing: 2px; cursor: pointer; color: #000; transition: transform 0.1s; }
        button:hover { transform: scale(1.05); background: #fff; }
        #controls-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 12px; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h1 style="color:#fff; margin-bottom:10px;">NEON <span style="color:#00d4ff">STRIKE</span></h1>
        <p style="color:#888; margin-bottom:20px;">ULTIMATE EDITION</p>
        <button id="btn-conn" onclick="connectToCloud()">DÉPLOIEMENT</button>
    </div>
</div>

<div id="ui">
    <div class="hud-panel">
        <div style="font-size:24px; font-weight:bold;">SCORE: <span id="score">0</span></div>
    </div>
    <div class="hud-panel">
        <div>SANTÉ</div>
        <div id="health-bar-bg"><div id="health-bar"></div></div>
    </div>
    <div class="hud-panel" style="font-size:12px; color:#aaa;">
        [CLIC G] TIR | [CLIC D] POMPE<br>[ESPACE] DASH
    </div>
</div>

<div id="kill-feed"></div>
<div id="controls-hint">ZQSD pour bouger • SOURIS pour viser</div>

<script>
const KEYS = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0;
let ably, channel, myID;
let otherPlayers = {}, bullets = [], particles = [], walls = [], teleporters = [];
let keysDown = {}, mouseRight = false;
let hp = 100, score = 0;
let lastShoot = 0, lastDash = 0, lastSync = 0, lastTeleport = 0;

// Config Gameplay
const SPEED = 35;
const DASH_FORCE = 150;
const DASH_COOLDOWN = 1500;

async function connectToCloud() {
    const btn = document.getElementById('btn-conn');
    btn.textContent = "CONNEXION...";
    btn.disabled = true;
    myID = "P-" + Math.floor(Math.random()*1000);

    try {
        ably = new Ably.Realtime({ key: KEYS[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-ultimate');
            channel.subscribe('p', handleMessage);
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur: " + e.message); btn.disabled = false; }
}

function handleMessage(m) {
    if (m.data.o === myID) return;
    const d = m.data;
    if (d.t === 'm') updateRemote(d);
    else if (d.t === 'f') createBullet(d);
    else if (d.t === 'h' && d.tgt === myID) takeDamage(d.dmg, d.o);
    else if (d.t === 'k') addKillFeed(d.killer, d.victim);
}

function initGame() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.015); // Brouillard pour l'ambiance
    
    camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000510);
    document.body.appendChild(renderer.domElement);
    
    // Éclairage
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const pLight = new THREE.PointLight(0x00d4ff, 1, 60);
    pLight.position.set(0, 40, 0);
    scene.add(pLight);

    buildMap();
    playerGroup = createPlayerMesh(0x00d4ff);
    scene.add(playerGroup);
    
    setupInputs();
    loop();
}

function createPlayerMesh(col) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.5 });
    // Construction du corps simple
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), mat);
    body.position.y = 1.9;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat);
    head.position.y = 3.1;
    // Ajout d'une "visière" brillante
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.15, 0.3), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    visor.position.set(0, 3.1, -0.15);
    g.add(body, head, visor);
    return g;
}

function buildMap() {
    // Sol Grid Tron-style
    const grid = new THREE.GridHelper(500, 100, 0x0055ff, 0x111122);
    scene.add(grid);
    
    // Etage 1 (Verre)
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.15, side: THREE.DoubleSide }));
    glass.rotation.x = -Math.PI/2; glass.position.y = 29.9;
    scene.add(glass);

    // Murs Aléatoires
    for(let i=0; i<35; i++) {
        let x = (Math.random()-0.5)*250, z = (Math.random()-0.5)*250;
        if(Math.abs(x)<20 && Math.abs(z)<20) continue; // Zone safe au centre
        createWall(x, 0, z, 10, 10, 15); // RDC
        createWall(x+30, 30, z-30, 15, 2, 15); // Etage
    }
    
    // Téléporteurs
    createPad(0, 0, 0, 30, 0xd400ff);
    createPad(80, 0, 80, 30, 0xd400ff);
    createPad(0, 30, 0, 0, 0x00d4ff);
}

function createWall(x, y, z, w, d, h) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color: 0x112233, emissive: 0x001133, emissiveIntensity: 0.2 });
    // Bords néons
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x00d4ff }));
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y+h/2, z); edges.position.copy(m.position);
    scene.add(m); scene.add(edges);
    walls.push({ minX:x-w/2, maxX:x+w/2, minZ:z-d/2, maxZ:z+d/2, minY:y, maxY:y+h });
}

function createPad(x, y, z, ty, col) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(4,4,0.2,32), new THREE.MeshBasicMaterial({ color: col }));
    m.position.set(x, y+0.1, z); scene.add(m);
    teleporters.push({x,y,z,ty,mesh:m});
}

function loop() {
    requestAnimationFrame(loop);
    const now = Date.now();
    const dt = 0.016;

    // Mouvements
    let speed = SPEED;
    // Dash Logic
    if(keysDown['Space'] && now - lastDash > DASH_COOLDOWN) {
        lastDash = now;
        speed = DASH_FORCE; // Boost de vitesse
        createExplosion(playerGroup.position, 0x00d4ff, 10); // Effet visuel
    }
    if(now - lastDash < 200) speed = DASH_FORCE; // Durée du dash

    const move = new THREE.Vector3();
    if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));

    if(move.length() > 0) {
        const s = move.normalize().multiplyScalar(speed * dt);
        const nextX = playerGroup.position.x + s.x;
        const nextZ = playerGroup.position.z + s.z;
        if(!checkWall(nextX, playerGroup.position.y, playerGroup.position.z)) playerGroup.position.x = nextX;
        if(!checkWall(playerGroup.position.x, playerGroup.position.y, nextZ)) playerGroup.position.z = nextZ;
    }
    playerGroup.rotation.y = yaw;

    // Téléportation
    if(now - lastTeleport > 2000) {
        teleporters.forEach(tp => {
            if(Math.abs(playerGroup.position.y-tp.y)<5 && playerGroup.position.distanceTo(tp.mesh.position)<4) {
                playerGroup.position.y = tp.ty;
                lastTeleport = now;
                createExplosion(playerGroup.position, 0xd400ff, 20);
            }
        });
    }

    // Gestion Balles
    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i];
        b.mesh.position.addScaledVector(b.dir, b.speed * dt);
        
        // Collision Mur
        if(checkWall(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z)) {
            createExplosion(b.mesh.position, b.col, 5);
            scene.remove(b.mesh); bullets.splice(i,1); continue;
        }

        // Collision Joueur (si c'est ma balle)
        if(b.o === myID) {
            for(let id in otherPlayers) {
                if(b.mesh.position.distanceTo(otherPlayers[id].mesh.position) < 2.5) {
                    createExplosion(b.mesh.position, 0xff0000, 10);
                    channel.publish('p', { t:'h', o:myID, tgt:id, dmg:b.dmg });
                    scene.remove(b.mesh); bullets.splice(i,1); break;
                }
            }
        }
        if(bullets[i] && now > b.death) { scene.remove(b.mesh); bullets.splice(i,1); }
    }

    // Gestion Particules
    for(let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.mesh.position.add(p.vel);
        p.mesh.material.opacity -= 0.03;
        p.mesh.scale.multiplyScalar(0.9);
        if(p.mesh.material.opacity <= 0) { scene.remove(p.mesh); particles.splice(i,1); }
    }

    // Sync Reseau
    if(now - lastSync > 100) {
        channel.publish('p', { t:'m', o:myID, x:playerGroup.position.x, y:playerGroup.position.y, z:playerGroup.position.z, ry:yaw });
        lastSync = now;
    }

    // Camera Suiveuse fluide
    const targetCamX = playerGroup.position.x - Math.sin(yaw)*14;
    const targetCamZ = playerGroup.position.z - Math.cos(yaw)*14;
    camera.position.x += (targetCamX - camera.position.x) * 0.1;
    camera.position.z += (targetCamZ - camera.position.z) * 0.1;
    camera.position.y = playerGroup.position.y + 9;
    camera.lookAt(playerGroup.position.x, playerGroup.position.y+2, playerGroup.position.z);
    
    renderer.render(scene, camera);
}

// --- SHOOTING & ABILITIES ---
function shoot(isShotgun) {
    const now = Date.now();
    const cooldown = isShotgun ? 1000 : 150;
    if(now - lastShoot < cooldown) return;
    lastShoot = now;

    if(isShotgun) {
        // Tirer 3 balles en éventail
        for(let i=-1; i<=1; i++) {
            const angle = yaw + i * 0.15;
            const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.8, z:playerGroup.position.z, dx:Math.sin(angle), dy:0, dz:Math.cos(angle), spd:90, dmg:15, col:0xffaa00 };
            channel.publish('p', d); createBullet(d);
        }
        // Recul
        playerGroup.position.add(new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)));
    } else {
        // Tir normal précis
        const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.8, z:playerGroup.position.z, dx:Math.sin(yaw), dy:0, dz:Math.cos(yaw), spd:130, dmg:10, col:0x00ffcc };
        channel.publish('p', d); createBullet(d);
    }
}

function createBullet(d) {
    const geo = d.dmg > 12 ? new THREE.BoxGeometry(0.4,0.4,0.8) : new THREE.SphereGeometry(0.2);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: d.col }));
    m.position.set(d.x, d.y, d.z); 
    m.rotation.y = Math.atan2(d.dx, d.dz);
    scene.add(m);
    bullets.push({ mesh:m, dir:new THREE.Vector3(d.dx, d.dy, d.dz), speed:d.spd, dmg:d.dmg, col:d.col, o:d.o, death:Date.now()+2000 });
}

function createExplosion(pos, col, count) {
    const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
    const mat = new THREE.MeshBasicMaterial({ color: col, transparent: true });
    for(let i=0; i<count; i++) {
        const m = new THREE.Mesh(geo, mat.clone());
        m.position.copy(pos);
        scene.add(m);
        particles.push({ 
            mesh: m, 
            vel: new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).multiplyScalar(0.5) 
        });
    }
}

function takeDamage(dmg, attackerId) {
    hp -= dmg;
    document.getElementById('health-bar').style.width = Math.max(0, hp) + "%";
    createExplosion(playerGroup.position, 0xff0000, 5); // Sang
    
    if(hp <= 0) {
        channel.publish('p', { t:'k', killer:attackerId, victim:myID });
        hp = 100;
        playerGroup.position.set(0, 30, 0); // Respawn en hauteur
        score = Math.max(0, score - 20); // Malus mort
        document.getElementById('score').textContent = score;
    }
}

function addKillFeed(killer, victim) {
    const feed = document.getElementById('kill-feed');
    const div = document.createElement('div');
    div.className = 'feed-item';
    div.innerHTML = `<span style="color:#00ffcc">${killer}</span> 🔫 <span style="color:#ff0055">${victim}</span>`;
    feed.appendChild(div);
    if(killer === myID) {
        score += 50;
        document.getElementById('score').textContent = score;
    }
    setTimeout(() => { div.style.opacity = 0; setTimeout(()=>div.remove(), 1000); }, 3000);
}

// Utils
function updateRemote(d) {
    if(!otherPlayers[d.o]) { otherPlayers[d.o] = { mesh: createPlayerMesh(0xff0055) }; scene.add(otherPlayers[d.o].mesh); }
    const p = otherPlayers[d.o].mesh;
    p.position.set(d.x, d.y, d.z); p.rotation.y = d.ry;
}
function checkWall(x, y, z) { return walls.some(w => x>w.minX && x<w.maxX && z>w.minZ && z<w.maxZ && y>=w.minY && y<=w.maxY); }

function setupInputs() {
    window.onkeydown = (e) => keysDown[e.code] = true;
    window.onkeyup = (e) => keysDown[e.code] = false;
    document.onmousemove = (e) => { if(document.pointerLockElement) yaw -= e.movementX * 0.003; };
    window.onmousedown = (e) => {
        if(!document.pointerLockElement) { renderer.domElement.requestPointerLock(); return; }
        if(e.button === 0) shoot(false); // Clic Gauche
        if(e.button === 2) shoot(true);  // Clic Droit
    };
}
</script>
</body>
</html>
