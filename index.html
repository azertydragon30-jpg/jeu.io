<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - ADMIN & EXPLOSIVES</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 35px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; text-align: right; }
        #weapon-info { font-size: 14px; color: #fff; text-transform: uppercase; }
        
        #leaderboard { position: fixed; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); border: 1px solid #00d4ff; padding: 10px; width: 180px; font-family: monospace; z-index: 100; pointer-events: none; border-radius: 4px; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 14px; color: #00d4ff; border-bottom: 1px solid #00d4ff; padding-bottom: 5px; text-transform: uppercase; }
        .leader-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
        .is-me { color: #00d4ff; font-weight: bold; }

        #sniper-scope { position: fixed; inset: 0; border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 1000px #000; border: 2px solid #555; background: radial-gradient(circle, transparent 30%, #000 80%); z-index: 20; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #00fff2; border-radius: 50%; pointer-events: none; box-shadow: 0 0 5px #00fff2; z-index: 21; }
        #hit-marker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 24px; height: 24px; border: 3px solid #ff0055; opacity: 0; transition: opacity 0.1s; pointer-events: none; border-left: none; border-top: none; z-index: 22; }
        
        #reload-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #ff0055; font-weight: bold; display: none; text-shadow: 0 0 10px red; animation: blink 0.3s infinite; z-index: 25; }
        @keyframes blink { 50% { opacity: 0; } }
        
        #kill-feed { position: absolute; top: 150px; right: 20px; text-align: right; font-size: 14px; font-weight: bold; font-family: monospace; z-index: 10; }
        .kill-item { background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; margin-bottom: 2px; border-right: 3px solid #00d4ff; animation: fadeout 4s forwards; }
        @keyframes fadeout { 0% { opacity:1; transform:translateX(20px); } 10% { transform:translateX(0); } 80% { opacity:1; } 100% { opacity:0; display:none; } }

        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; background: radial-gradient(circle at center, #112 0%, #000 100%); }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 1px solid #00d4ff; text-align: center; border-radius: 5px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); }
        button { padding: 15px 40px; background: linear-gradient(45deg, #00d4ff, #0088aa); border: none; font-weight: 900; letter-spacing: 2px; cursor: pointer; color: #000; transition: transform 0.1s; text-transform: uppercase; margin: 10px; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }

        #admin-console { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); border: 1px solid #ff0055; padding: 5px; z-index: 1000; display: none; }
        #admin-input { background: #000; border: 1px solid #ff0055; color: #0f0; width: 350px; font-family: monospace; outline: none; padding: 5px; }
        #admin-help-tip { font-size: 10px; color: #ff0055; margin-top: 5px; }

        #mobile-controls { display: none; position: absolute; inset: 0; z-index: 50; pointer-events: none; }
        .touch-zone { position: absolute; bottom: 50px; width: 150px; height: 150px; pointer-events: auto; }
        #stick-container { left: 30px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; background: rgba(0,0,0,0.2); }
        #stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0, 212, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 40; }
        .mob-btn { position: absolute; width: 70px; height: 70px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h1>NEON <span style="color:#00d4ff">STRIKE</span></h1>
        <p style="color:#888; margin-bottom:20px;">ADMIN & EXPLOSIVES UPDATE</p>
        <button id="btn-conn" onclick="connectToCloud()">DÉPLOIEMENT</button>
    </div>
</div>

<div id="ui">
    <div class="hud-panel"><div style="font-size:24px; font-weight:bold;">SCORE: <span id="score">0</span></div></div><br>
    <div class="hud-panel"><div>SANTÉ</div><div id="health-bar-bg"><div id="health-bar"></div></div></div>
</div>

<div id="leaderboard"><h3>Classement</h3><div id="leaderboard-list"></div></div>
<div id="ammo-box"><div id="weapon-info">MITRAILLETTE</div><span id="ammo-val">--</span> / <span id="ammo-max">--</span></div>
<div id="reload-msg">RECHARGEMENT...</div>
<div id="kill-feed"></div>
<div id="crosshair"></div>
<div id="sniper-scope"></div>
<div id="hit-marker"></div>

<div id="admin-console">
    <input type="text" id="admin-input" placeholder="Tapez une commande (ex: /kill)...">
    <div id="admin-help-tip">/kill (soi-même) | /kill all (tous les bots) | /kill bot (le plus proche)</div>
</div>

<div id="mobile-controls">
    <div id="stick-container" class="touch-zone"><div id="stick"></div></div>
    <div id="look-zone"></div>
    <div id="btn-fire" class="mob-btn" style="bottom:60px; right:40px;">🔥</div>
</div>

<script>
const KEYS_CONFIG = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0, pitch = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], bots = [], explosives = [];
let keysDown = {}, hp = 100, score = 0, vy = 0, jumpCount = 0;
let lastShoot = 0, lastDash = 0, isReloading = false, isSniper = false, dashPower = 0;
let isPaused = false, adminMode = false, adminEnabledByConsole = false;
let audioCtx;

// --- INITIALISATION ---

async function connectToCloud() {
    const btn = document.getElementById('btn-conn');
    btn.textContent = "CHARGEMENT..."; btn.disabled = true;
    myID = "Ghost-" + Math.floor(Math.random()*999);
    
    try {
        ably = new Ably.Realtime({ key: KEYS_CONFIG[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite');
            channel.subscribe('p', handleMessage);
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur Ably: " + e.message); btn.disabled = false; }
}

function initGame() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050a15, 0.005);
    camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 2000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0x00d4ff, 0.8); sun.position.set(50, 100, 50); scene.add(sun);
    
    buildMap();
    playerGroup = createPlayerMesh(0x00d4ff, false); playerGroup.position.set(0, 5, 0); scene.add(playerGroup);
    for(let i=0; i<5; i++) spawnBot();
    
    switchWeapon(0);
    setupInputs();
    loop();
}

// --- LOGIQUE ADMIN ---

window.admin = function() {
    adminEnabledByConsole = true;
    console.log("%c[ADMIN] Console déverrouillée (F2).", "color: #ff0055; font-weight: bold;");
    return "Mode Admin activé.";
};

function handleAdmin(cmd) {
    const parts = cmd.toLowerCase().trim().split(' ');
    
    if (parts[0] === '/kill') {
        if (parts[1] === 'all') {
            bots.forEach(b => { addKillFeed("ADMIN", "Bot Purged"); scene.remove(b.mesh); });
            bots = [];
            setTimeout(() => { for(let i=0; i<5; i++) spawnBot(); }, 3000);
        } else if (parts[1] === 'bot') {
            let closest = null, minDist = Infinity;
            bots.forEach(b => {
                let d = b.mesh.position.distanceTo(playerGroup.position);
                if (d < minDist) { minDist = d; closest = b; }
            });
            if (closest) { 
                closest.hp = 0; 
                addKillFeed("ADMIN", "Bot Sniped"); 
                scene.remove(closest.mesh);
                bots = bots.filter(b => b !== closest);
                setTimeout(spawnBot, 4000);
            }
        } else {
            takeDamage(100, "Suicide");
        }
    } else if (parts[0] === 'god') {
        adminMode = !adminMode;
        addKillFeed("SYSTEM", adminMode ? "God Mode ON" : "God Mode OFF");
    }
}

// --- CORE GAMEPLAY ---

const WEAPONS = [
    { name: "Mitraillette", ammo: 50, maxAmmo: 50, rate: 80, dmg: 6, speed: 200, color: 0xff00cc, spread: 0.05, count: 1, size: 0.6 },
    { name: "Sniper Railgun", ammo: 5, maxAmmo: 5, rate: 1000, dmg: 90, speed: 400, color: 0x00ffff, spread: 0, count: 1, size: 1.2 }
];
let currentWeaponIdx = 0;

function buildMap() {
    createFloor(0, 0, 0, 500, 500, 0x050a15);
    createWall(20, 0, 20, 10, 10, 8, 0x00d4ff);
    createWall(-20, 0, -20, 10, 10, 8, 0x00d4ff);
    // Barils Explosifs
    createExplosive(10, 0, 10);
    createExplosive(-15, 0, 25);
    createExplosive(0, 0, -30);
}

function createFloor(x, y, z, w, d, col) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ color: col }));
    m.rotation.x = -Math.PI/2; m.position.set(x, y, z); scene.add(m);
}

function createWall(x, y, z, w, d, h, col) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.2 }));
    m.position.set(x, y + h/2, z); scene.add(m);
    walls.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y, maxY: y+h });
}

function createExplosive(x, y, z) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 2.5, 12), new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 }));
    m.position.set(x, y + 1.25, z); scene.add(m);
    explosives.push({ mesh: m, x, y: y+1.25, z });
}

function triggerExplosion(x, y, z) {
    const radius = 15;
    const visual = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.8 }));
    visual.position.set(x, y, z); scene.add(visual);
    
    let s = 1;
    const intrvl = setInterval(() => {
        s += 1.5; visual.scale.set(s,s,s); visual.material.opacity -= 0.1;
        if(s > 15) { scene.remove(visual); clearInterval(intrvl); }
    }, 20);

    // Dégâts
    if(playerGroup.position.distanceTo(new THREE.Vector3(x, y, z)) < radius) takeDamage(80, "Explosion");
    bots.forEach((b, i) => {
        if(b.mesh.position.distanceTo(new THREE.Vector3(x, y, z)) < radius) {
            b.hp -= 120;
            if(b.hp <= 0) { addKillFeed("Explosion", "Bot"); scene.remove(b.mesh); bots.splice(i,1); setTimeout(spawnBot, 4000); }
        }
    });
}

function spawnBot() {
    const b = { mesh: createPlayerMesh(0xffff00, true), hp: 100, lastShoot: 0 };
    b.mesh.position.set((Math.random()-0.5)*100, 2, (Math.random()-0.5)*100);
    scene.add(b.mesh); bots.push(b);
}

function loop() {
    requestAnimationFrame(loop);
    const dt = 0.016;

    // Déplacement
    let moveSpeed = 30;
    const move = new THREE.Vector3();
    if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    
    if(move.length() > 0) {
        let s = move.normalize().multiplyScalar(moveSpeed * dt);
        playerGroup.position.x += s.x; playerGroup.position.z += s.z;
    }

    // Gravité simple
    vy -= 50 * dt; playerGroup.position.y += vy * dt;
    if(playerGroup.position.y < 0) { playerGroup.position.y = 0; vy = 0; jumpCount = 0; }

    // Balles
    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * dt);
        if(b.mesh.position.length() > 500) { scene.remove(b.mesh); bullets.splice(i,1); continue; }
        
        // Hit Barils
        explosives.forEach((exp, ei) => {
            if(b.mesh.position.distanceTo(exp.mesh.position) < 2) {
                triggerExplosion(exp.x, exp.y, exp.z);
                scene.remove(exp.mesh); explosives.splice(ei, 1);
            }
        });

        // Hit Bots
        bots.forEach((bot, bi) => {
            if(b.mesh.position.distanceTo(bot.mesh.position) < 2 && b.o === myID) {
                bot.hp -= b.dmg; scene.remove(b.mesh); bullets.splice(i,1);
                if(bot.hp <= 0) { addKillFeed("Moi", "Bot"); scene.remove(bot.mesh); bots.splice(bi,1); setTimeout(spawnBot, 4000); }
            }
        });
    }

    camera.position.lerp(new THREE.Vector3(playerGroup.position.x - Math.sin(yaw)*12, playerGroup.position.y + 6, playerGroup.position.z - Math.cos(yaw)*12), 0.1);
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2, playerGroup.position.z);
    
    renderer.render(scene, camera);
}

// --- UTILS ---

function handleMessage(m) {
    if (m.data.t === 'f') createBullet(m.data);
}

function createBullet(d) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 2), new THREE.MeshBasicMaterial({ color: d.col }));
    m.position.set(d.x, d.y, d.z); m.lookAt(d.x+d.dx, d.y+d.dy, d.z+d.dz);
    scene.add(m); bullets.push({ mesh: m, dir: new THREE.Vector3(d.dx, d.dy, d.dz), speed: d.spd, dmg: d.dmg, o: d.o });
}

function shoot() {
    const w = WEAPONS[currentWeaponIdx];
    if(Date.now() - lastShoot < w.rate) return;
    lastShoot = Date.now();
    const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.5, z:playerGroup.position.z, dx:Math.sin(yaw), dy:0, dz:Math.cos(yaw), spd:w.speed, dmg:w.dmg, col:w.color };
    channel.publish('p', d); createBullet(d);
}

function takeDamage(d, from) {
    if(adminMode) return;
    hp -= d; document.getElementById('health-bar').style.width = Math.max(0, hp) + "%";
    if(hp <= 0) { hp = 100; playerGroup.position.set(0, 5, 0); addKillFeed(from, "Moi"); }
}

function addKillFeed(k, v) {
    const item = document.createElement('div'); item.className = 'kill-item';
    item.innerHTML = `<b>${k}</b> ⚡ ${v}`; document.getElementById('kill-feed').prepend(item);
    if(k === "Moi") { score += 100; document.getElementById('score').textContent = score; }
}

function switchWeapon(i) {
    currentWeaponIdx = i;
    document.getElementById('weapon-info').textContent = WEAPONS[i].name;
    document.getElementById('ammo-val').textContent = WEAPONS[i].ammo;
    document.getElementById('ammo-max').textContent = WEAPONS[i].maxAmmo;
}

function createPlayerMesh(col, hb) {
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 1), new THREE.MeshStandardMaterial({ color: col }));
    m.position.y = 1.5; g.add(m); return g;
}

function setupInputs() {
    window.onkeydown = e => {
        if(e.code === 'F2' && adminEnabledByConsole) {
            const c = document.getElementById('admin-console');
            c.style.display = c.style.display === 'none' ? 'block' : 'none';
            if(c.style.display === 'block') document.getElementById('admin-input').focus();
        }
        if(document.activeElement.id === 'admin-input') {
            if(e.code === 'Enter') { handleAdmin(document.activeElement.value); document.activeElement.value = ''; }
            return;
        }
        keysDown[e.code] = true;
        if(e.code === 'Space' && jumpCount < 2) { vy = 20; jumpCount++; }
    };
    window.onkeyup = e => keysDown[e.code] = false;
    window.onmousedown = e => { if(e.button === 0) shoot(); };
    window.onmousemove = e => { if(!document.activeElement.id.includes('admin')) yaw -= e.movementX * 0.005; };
    renderer.domElement.onclick = () => renderer.domElement.requestPointerLock();
}
</script>
</body>
</html>
