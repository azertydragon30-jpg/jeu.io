<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - COMPLEX MAP UPDATE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-touch-callout: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 35px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; text-align: right; }
        #weapon-info { font-size: 14px; color: #fff; text-transform: uppercase; }
        
        #sniper-scope { position: fixed; inset: 0; border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 1000px #000; border: 2px solid #555; background: radial-gradient(circle, transparent 30%, #000 80%); z-index: 20; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #00fff2; border-radius: 50%; pointer-events: none; box-shadow: 0 0 5px #00fff2; z-index: 21; }
        #hit-marker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 24px; height: 24px; border: 3px solid #ff0055; opacity: 0; transition: opacity 0.1s; pointer-events: none; border-left: none; border-top: none; z-index: 22; }
        
        #reload-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #ff0055; font-weight: bold; display: none; text-shadow: 0 0 10px red; animation: blink 0.3s infinite; z-index: 25; }
        @keyframes blink { 50% { opacity: 0; } }
        
        #kill-feed { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 16px; font-weight: bold; font-family: monospace; z-index: 10; }
        .kill-item { background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; margin-bottom: 2px; border-right: 3px solid #00d4ff; animation: fadeout 4s forwards; }
        @keyframes fadeout { 0% { opacity:1; transform:translateX(20px); } 10% { transform:translateX(0); } 80% { opacity:1; } 100% { opacity:0; display:none; } }

        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; background: radial-gradient(circle at center, #112 0%, #000 100%); }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 1px solid #00d4ff; text-align: center; border-radius: 5px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); }
        button { padding: 15px 40px; background: linear-gradient(45deg, #00d4ff, #0088aa); border: none; font-weight: 900; letter-spacing: 2px; cursor: pointer; color: #000; transition: transform 0.1s; text-transform: uppercase; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }

        #mobile-controls { display: none; position: absolute; inset: 0; z-index: 50; pointer-events: none; }
        .touch-zone { position: absolute; bottom: 50px; width: 150px; height: 150px; pointer-events: auto; }
        #stick-container { left: 30px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; background: rgba(0,0,0,0.2); }
        #stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0, 212, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 40; }
        .mob-btn { position: absolute; width: 70px; height: 70px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation; user-select: none; }
        .mob-btn:active { background: #00d4ff; color: #000; transform: scale(0.95); }
        #btn-fire { bottom: 60px; right: 40px; width: 90px; height: 90px; border-color: #ff0055; background: rgba(255,0,85,0.2); font-size: 40px; z-index: 60; }
        #btn-jump { bottom: 180px; right: 40px; z-index: 60; }
        #btn-scope { bottom: 60px; right: 150px; font-size: 20px; z-index: 60; }
        #btn-swap { bottom: 270px; right: 40px; font-size: 16px; border-color: #00ffcc; z-index: 60; }
    </style>
</head>
<body>

<div id="login"><div class="box"><h1>NEON <span style="color:#00d4ff">STRIKE</span></h1><p style="color:#888; margin-bottom:20px;">COMPLEX MAP UPDATE</p><button id="btn-conn" onclick="connectToCloud()">DÉPLOIEMENT</button></div></div>

<div id="ui">
    <div class="hud-panel"><div style="font-size:24px; font-weight:bold;">SCORE: <span id="score">0</span></div></div><br>
    <div class="hud-panel"><div>SANTÉ</div><div id="health-bar-bg"><div id="health-bar"></div></div></div>
</div>

<div id="ammo-box">
    <div id="weapon-info">FUSIL D'ASSAUT</div>
    <span id="ammo-val">30</span> / 30
</div>
<div id="reload-msg">RECHARGEMENT...</div>
<div id="kill-feed"></div>
<div id="crosshair"></div>
<div id="sniper-scope"></div>
<div id="hit-marker"></div>

<div id="mobile-controls">
    <div id="stick-container" class="touch-zone"><div id="stick"></div></div>
    <div id="look-zone"></div>
    <div id="btn-fire" class="mob-btn" ontouchstart="startFire(event)" ontouchend="stopFire(event)">🔥</div>
    <div id="btn-jump" class="mob-btn" ontouchstart="jump(event)">⬆️</div>
    <div id="btn-scope" class="mob-btn" ontouchstart="toggleScope(event)">🎯</div>
    <div id="btn-swap" class="mob-btn" ontouchstart="cycleWeapon(event)">SWAP</div>
</div>

<script>
const KEYS_CONFIG = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], bots = [], jumpPads = [];
let keysDown = {}, hp = 100, score = 0;
let lastShoot = 0, lastDash = 0, lastSync = 0, shakeTime = 0;
let isReloading = false, isSniper = false;
let audioCtx, vy = 0; const GRAVITY = -48; const JUMP_FORCE = 22; let canJump = false, jumpCount = 0;
let isMobile = false, touchMove = { x: 0, y: 0 }, isFiring = false;

const WEAPONS = [
    { name: "Fusil d'Assaut", ammo: 30, maxAmmo: 30, rate: 120, dmg: 12, speed: 180, color: 0x00ffcc, spread: 0, count: 1 },
    { name: "Pompe de Combat", ammo: 8, maxAmmo: 8, rate: 800, dmg: 10, speed: 150, color: 0xffaa00, spread: 0.15, count: 7 },
    { name: "Railgun Sniper", ammo: 5, maxAmmo: 5, rate: 1000, dmg: 85, speed: 400, color: 0xff00ff, spread: 0, count: 1 }
];
let currentWeaponIdx = 0;

async function connectToCloud() {
    const btn = document.getElementById('btn-conn');
    btn.textContent = "CONNEXION..."; btn.disabled = true;
    checkMobile();
    myID = "Ghost-" + Math.floor(Math.random()*999);
    initAudio(); 
    try {
        ably = new Ably.Realtime({ key: KEYS_CONFIG[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite');
            channel.subscribe('p', handleMessage);
            channel.presence.subscribe('leave', member => { removeRemote(member.clientId); });
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur: " + e.message); btn.disabled = false; }
}

function checkMobile() {
    isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800;
    if (isMobile) { document.getElementById('mobile-controls').style.display = 'block'; setupTouchControls(); }
}

function handleMessage(m) {
    if (m.data.o === myID) return;
    const d = m.data;
    if (d.t === 'm') updateRemote(d);
    else if (d.t === 'f') { createBullet(d); playSound('laser', 0.2); }
    else if (d.t === 'h' && d.tgt === myID) { takeDamage(d.dmg, d.o); playSound('hit', 0.5); }
    else if (d.t === 'k') addKillFeed(d.killer, d.victim);
}

function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type, vol=0.1) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='shoot') { osc.type='square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
    else if(type==='laser') { osc.type='sawtooth'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime+0.2); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.2); osc.start(); osc.stop(audioCtx.currentTime+0.2); }
    else if(type==='jump') { osc.type='sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime+0.1); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime+0.3); osc.start(); osc.stop(audioCtx.currentTime+0.3); }
    else if(type==='hit') { osc.type='sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
}

function initGame() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.012);
    camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000510);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    
    buildMap();
    playerGroup = createPlayerMesh(0x00d4ff);
    scene.add(playerGroup);
    
    for(let i=0; i<8; i++) spawnBot();
    setupInputs();
    loop();
}

function createPlayerMesh(col) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.5 });
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), mat); b.position.y = 0.9;
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat); h.position.y = 2.1;
    g.add(b, h); return g;
}

// --- LOGIQUE DE MAP COMPLEXE ---
function buildMap() {
    const grid = new THREE.GridHelper(1000, 100, 0x0033aa, 0x050510); scene.add(grid);
    
    // 1. CENTRE : Plateforme & Pilier
    createWall(0, 0, 0, 30, 30, 6, 0x111122); // Base centrale
    createWall(0, 6, 0, 10, 10, 20, 0x00d4ff); // Pilier central brillant
    createJumpPad(0, 0, 20); createJumpPad(0, 0, -20); // Accès centre

    // 2. LES 4 QUARTIERS (Bâtiments tactiques)
    const sectors = [
        {x: 60, z: 60, col: 0xff0055}, 
        {x: -60, z: 60, col: 0x00ffcc},
        {x: 60, z: -60, col: 0xffff00},
        {x: -60, z: -60, col: 0xff00ff}
    ];

    sectors.forEach(s => {
        // Bâtiment principal de secteur
        createWall(s.x, 0, s.z, 25, 25, 15, 0x112233);
        // Corniche
        createWall(s.x, 15, s.z, 28, 28, 1, s.col);
        // Mur de protection sur le toit
        createWall(s.x + 10, 16, s.z, 2, 20, 3, 0x222222);
        // Jump Pad pour monter au bâtiment
        createJumpPad(s.x > 0 ? s.x-20 : s.x+20, 0, s.z);
    });

    // 3. COUVERTURES TACTIQUES (Crates et Murs bas)
    for(let i=0; i<15; i++) {
        let rx = (Math.random()-0.5)*200;
        let rz = (Math.random()-0.5)*200;
        if(Math.abs(rx) < 20 && Math.abs(rz) < 20) rx += 40; // Eviter le centre
        createWall(rx, 0, rz, 4, 4, 4, 0x00d4ff);
    }

    // 4. MURS EXTÉRIEURS (Limites)
    const limit = 200;
    createWall(0, 0, limit, limit*2, 10, 50, 0x050510);
    createWall(0, 0, -limit, limit*2, 10, 50, 0x050510);
    createWall(limit, 0, 0, 10, limit*2, 50, 0x050510);
    createWall(-limit, 0, 0, 10, limit*2, 50, 0x050510);
}

function createWall(x, y, z, w, d, h, color = 0x112233) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.8 })); 
    m.position.set(x, y + h/2, z); 
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.4 })); 
    edges.position.copy(m.position); scene.add(m, edges);
    walls.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y, maxY: y+h });
}

function createJumpPad(x, y, z) {
    const geo = new THREE.CylinderGeometry(3, 3, 0.5, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, 0.25, z);
    const glow = new THREE.PointLight(0x00ffff, 2, 10); glow.position.copy(m.position);
    scene.add(m, glow);
    jumpPads.push({ x, z, radius: 3 });
}

function spawnBot() {
    const bot = { id: "Bot-" + Math.floor(Math.random()*1000), mesh: createPlayerMesh(0xffff00), hp: 80, lastShoot: 0, dir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize(), changeDirAt: Date.now() + 2000 };
    bot.mesh.position.set((Math.random()-0.5)*180, 0, (Math.random()-0.5)*180); scene.add(bot.mesh); bots.push(bot);
}

function switchWeapon(idx) {
    if (idx === currentWeaponIdx || isReloading) return;
    currentWeaponIdx = idx;
    document.getElementById('weapon-info').textContent = WEAPONS[idx].name;
    document.getElementById('ammo-val').textContent = WEAPONS[idx].ammo;
    if (idx !== 2 && isSniper) toggleScope();
    playSound('jump', 0.05);
}

function cycleWeapon(e) { if(e) e.preventDefault(); switchWeapon((currentWeaponIdx + 1) % WEAPONS.length); }

function loop() {
    requestAnimationFrame(loop);
    const now = Date.now(), dt = 0.016;
    if(isFiring) shoot();

    // Bots logic
    bots.forEach(bot => {
        if (now > bot.changeDirAt) { bot.dir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize(); bot.changeDirAt = now + 2000 + Math.random()*3000; }
        const nextX = bot.mesh.position.x + bot.dir.x * 12 * dt; const nextZ = bot.mesh.position.z + bot.dir.z * 12 * dt;
        if (!checkWall(nextX, bot.mesh.position.y + 1, nextZ)) { bot.mesh.position.x = nextX; bot.mesh.position.z = nextZ; }
        bot.mesh.rotation.y = Math.atan2(bot.dir.x, bot.dir.z);
        if (bot.mesh.position.distanceTo(playerGroup.position) < 50 && now - bot.lastShoot > 1200) {
            bot.lastShoot = now; const shootDir = playerGroup.position.clone().sub(bot.mesh.position).normalize();
            createBullet({ t:'f', o:bot.id, x:bot.mesh.position.x, y:bot.mesh.position.y+1.8, z:bot.mesh.position.z, dx:shootDir.x, dy:shootDir.y, dz:shootDir.z, spd:80, dmg:8, col:0xffaa00 });
        }
    });

    const isCrouch = keysDown['KeyC'] || keysDown['ControlLeft'];
    let moveSpeed = 32;
    if(keysDown['ShiftLeft'] && now - lastDash > 1500) { lastDash = now; moveSpeed = 130; shakeTime = 5; }

    const move = new THREE.Vector3();
    if(keysDown['KeyW'] || keysDown['ArrowUp']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS'] || keysDown['ArrowDown']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA'] || keysDown['ArrowLeft']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD'] || keysDown['ArrowRight']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));

    if(isMobile) {
        move.add(new THREE.Vector3(Math.sin(yaw) * -touchMove.y * 0.5, 0, Math.cos(yaw) * -touchMove.y * 0.5));
        move.add(new THREE.Vector3(Math.cos(yaw) * touchMove.x * 0.5, 0, -Math.sin(yaw) * touchMove.x * 0.5));
    }

    if(move.length() > 0) {
        let s = move.normalize().multiplyScalar(moveSpeed * dt);
        const nextX = playerGroup.position.x + s.x;
        const nextZ = playerGroup.position.z + s.z;
        if(!checkWall(nextX, playerGroup.position.y + 1, playerGroup.position.z)) playerGroup.position.x = nextX;
        if(!checkWall(playerGroup.position.x, playerGroup.position.y + 1, nextZ)) playerGroup.position.z = nextZ;
    }
    
    // Jump Pads check
    jumpPads.forEach(pad => {
        let d = Math.sqrt((playerGroup.position.x-pad.x)**2 + (playerGroup.position.z-pad.z)**2);
        if(d < pad.radius && Math.abs(playerGroup.position.y - 0.25) < 2) { vy = 60; playSound('jump', 0.4); }
    });

    vy += GRAVITY * dt; 
    playerGroup.position.y += vy * dt;
    
    let onObject = false;
    if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; vy = 0; onObject = true; }
    else {
        walls.forEach(w => {
            if (playerGroup.position.x > w.minX && playerGroup.position.x < w.maxX && playerGroup.position.z > w.minZ && playerGroup.position.z < w.maxZ) {
                if (playerGroup.position.y <= w.maxY && playerGroup.position.y > w.maxY - 4 && vy <= 0) {
                    playerGroup.position.y = w.maxY; vy = 0; onObject = true;
                }
            }
        });
    }

    if(onObject) { canJump = true; jumpCount = 0; }
    playerGroup.rotation.y = yaw;

    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * dt);
        if(checkWall(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z)) { scene.remove(b.mesh); bullets.splice(i,1); continue; }
        if(b.o === myID) {
            bots.forEach((bot, botIdx) => {
                if(b.mesh.position.distanceTo(bot.mesh.position.clone().add(new THREE.Vector3(0,1,0))) < 2.5) {
                    bot.hp -= b.dmg; triggerHitMarker(); scene.remove(b.mesh); bullets.splice(i,1);
                    if(bot.hp <= 0) { addKillFeed("Toi", "Bot"); scene.remove(bot.mesh); bots.splice(botIdx, 1); setTimeout(spawnBot, 5000); }
                }
            });
        }
        if(bullets[i] && now > b.death) { scene.remove(b.mesh); bullets.splice(i,1); }
    }

    const camHeight = (isSniper ? 1.8 : 8); const camDist = isSniper ? 0 : 13;
    camera.position.lerp(new THREE.Vector3(playerGroup.position.x - Math.sin(yaw) * camDist, playerGroup.position.y + camHeight + (shakeTime > 0 ? Math.random() : 0), playerGroup.position.z - Math.cos(yaw) * camDist), 0.2);
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2.5, playerGroup.position.z);
    if(shakeTime > 0) shakeTime--;
    if(now - lastSync > 100) { channel.publish('p', { t:'m', o:myID, x:playerGroup.position.x, y:playerGroup.position.y, z:playerGroup.position.z, ry:yaw }); lastSync = now; }
    renderer.render(scene, camera);
}

function shoot() {
    const w = WEAPONS[currentWeaponIdx];
    if(isReloading || w.ammo <= 0) { if(w.ammo<=0) reload(); return; }
    if(Date.now() - lastShoot < w.rate) return;
    lastShoot = Date.now(); w.ammo--; document.getElementById('ammo-val').textContent = w.ammo;
    shakeTime = w.name.includes("Railgun") ? 12 : 5; playSound('shoot');
    for(let i=0; i<w.count; i++) {
        const spreadX = (Math.random()-0.5) * w.spread;
        const spreadY = (Math.random()-0.5) * w.spread;
        const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.8, z:playerGroup.position.z, dx:Math.sin(yaw+spreadX), dy:spreadY, dz:Math.cos(yaw+spreadX), spd:w.speed, dmg:w.dmg, col:w.color };
        channel.publish('p', d); createBullet(d);
    }
}

function jump(e) { if(e) e.preventDefault(); if (jumpCount < 2) { vy = JUMP_FORCE; jumpCount++; playSound('jump', 0.15); } }
function startFire(e) { e.preventDefault(); isFiring = true; shoot(); }
function stopFire(e) { e.preventDefault(); isFiring = false; }
function toggleScope(e) { if(e) e.preventDefault(); if(!isSniper) { isSniper=true; camera.fov=25; camera.updateProjectionMatrix(); document.getElementById('sniper-scope').style.display='block'; playerGroup.visible=false; } else { isSniper=false; camera.fov=80; camera.updateProjectionMatrix(); document.getElementById('sniper-scope').style.display='none'; playerGroup.visible=true; } }

function triggerHitMarker() { const hm = document.getElementById('hit-marker'); hm.style.opacity = 1; setTimeout(() => { hm.style.opacity = 0; }, 150); }
function reload(e) { if(e) e.preventDefault(); if(!isReloading){ isReloading=true; document.getElementById('reload-msg').style.display='block'; setTimeout(()=>{WEAPONS[currentWeaponIdx].ammo=WEAPONS[currentWeaponIdx].maxAmmo; document.getElementById('ammo-val').textContent=WEAPONS[currentWeaponIdx].ammo; isReloading=false; document.getElementById('reload-msg').style.display='none';},2000); } }
function createBullet(d) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.8), new THREE.MeshBasicMaterial({color:d.col})); m.position.set(d.x,d.y,d.z); m.lookAt(d.x+d.dx, d.y+d.dy, d.z+d.dz); scene.add(m); bullets.push({mesh:m, dir:new THREE.Vector3(d.dx,d.dy,d.dz), speed:d.spd, dmg:d.dmg, col:d.col, o:d.o, death:Date.now()+2000}); }
function takeDamage(d, id) { hp-=d; document.getElementById('health-bar').style.width=Math.max(0,hp)+"%"; if(hp<=0) { hp=100; playerGroup.position.set(0,30,0); score=Math.max(0,score-50); document.getElementById('score').textContent=score; } }
function addKillFeed(k,v) { const d=document.createElement('div'); d.className='kill-item'; d.innerHTML=`${k} 🔪 ${v}`; document.getElementById('kill-feed').prepend(d); if(k==="Toi"){score+=100; document.getElementById('score').textContent=score;} }
function updateRemote(d) { if(!otherPlayers[d.o]) { otherPlayers[d.o]={mesh:createPlayerMesh(0xff0055)}; scene.add(otherPlayers[d.o].mesh); } otherPlayers[d.o].mesh.position.set(d.x,d.y,d.z); otherPlayers[d.o].mesh.rotation.y=d.ry; }
function removeRemote(id) { if(otherPlayers[id]) { scene.remove(otherPlayers[id].mesh); delete otherPlayers[id]; } }
function checkWall(x,y,z) { return walls.some(w => x>w.minX && x<w.maxX && z>w.minZ && z<w.maxZ && y>=w.minY && y<=w.maxY); }

function setupInputs() {
    window.onkeydown=e=>{ keysDown[e.code]=true; if(e.code==='KeyR') reload(); if(e.code==='Space') jump(); if(e.code==='Digit1') switchWeapon(0); if(e.code==='Digit2') switchWeapon(1); if(e.code==='Digit3') switchWeapon(2); }; 
    window.onkeyup=e=>keysDown[e.code]=false;
    document.onmousemove=e=>{ if(document.pointerLockElement) yaw-=e.movementX*(isSniper?0.001:0.003) };
    window.onmousedown=()=>{ if(!isMobile) { if(document.pointerLockElement) shoot(); else { renderer.domElement.requestPointerLock(); initAudio(); } } };
}

function setupTouchControls() {
    const stickZone = document.getElementById('stick-container'), stick = document.getElementById('stick'), lookZone = document.getElementById('look-zone');
    stickZone.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0], r = stickZone.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2; let dx = t.clientX - cx, dy = t.clientY - cy, dist = Math.sqrt(dx*dx + dy*dy); if(dist > 50) { dx = (dx/dist)*50; dy = (dy/dist)*50; } stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; touchMove = { x: dx/50, y: dy/50 }; });
    stickZone.addEventListener('touchend', (e) => { e.preventDefault(); stick.style.transform = `translate(-50%, -50%)`; touchMove = { x: 0, y: 0 }; });
    let lx = 0; lookZone.addEventListener('touchstart', e => { lx = e.touches[0].clientX; });
    lookZone.addEventListener('touchmove', e => { e.preventDefault(); const tx = e.touches[0].clientX, dx = tx - lx; yaw -= dx * 0.005; lx = tx; });
}
