<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - Fixed Vertical</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Courier New', monospace; user-select: none; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #00d4ff; border-radius: 8px; z-index: 10; pointer-events: none; }
        #health-bar-container { width: 150px; height: 10px; background: #333; border: 1px solid #fff; margin-top: 5px; }
        #health-bar { width: 100%; height: 100%; background: #ff0055; transition: width 0.3s; }
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .box { background: #111; padding: 30px; border: 3px solid #00d4ff; border-radius: 15px; text-align: center; }
        button { padding: 12px 30px; cursor: pointer; background: #00d4ff; border: none; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        #notif { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); color: #d400ff; font-weight: bold; font-size: 24px; text-shadow: 0 0 10px #d400ff; pointer-events: none; text-align: center; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h1 style="color:#00d4ff">NEON STRIKE</h1>
        <button id="connectBtn" onclick="connectToCloud()">REJOINDRE</button>
    </div>
</div>

<div id="notif"></div>

<div id="ui">
    <div>SCORE: <span id="myScore">0</span></div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
    <div style="margin-top:5px; font-size:10px; color:#00d4ff">Dalles violettes = Téléportation</div>
</div>

<script>
const KEYS = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], teleporters = [], keysDown = {};
let hp = 100, score = 0, lastShoot = 0, lastSync = 0, lastTeleport = 0;

async function connectToCloud() {
    const btn = document.getElementById('connectBtn');
    btn.textContent = "CONNEXION...";
    btn.disabled = true;
    
    myID = "P-" + Math.random().toString(36).substr(2, 3).toUpperCase();
    
    try {
        ably = new Ably.Realtime({ key: KEYS[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-vert-v2');
            channel.subscribe('p', (m) => {
                if (m.data.o === myID) return;
                if (m.data.t === 'm') updateRemote(m.data);
                if (m.data.t === 'f') createBullet(m.data);
                if (m.data.t === 'h' && m.data.tgt === myID) takeDamage(m.data.dmg);
            });
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { 
        alert("Erreur Ably : " + e.message); 
        btn.disabled = false;
        btn.textContent = "REJOINDRE";
    }
}

// CORRECTION : Création du mesh sans Object.assign sur la position
function createPlayerMesh(col) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.3 });
    
    const parts = [
        { g: [0.5, 0.5, 0.5], p: [0, 2.6, 0] }, // tête
        { g: [0.8, 1.2, 0.4], p: [0, 1.8, 0] }, // torse
        { g: [0.25, 1, 0.25], p: [-0.55, 1.8, 0] }, // bras L
        { g: [0.25, 1, 0.25], p: [0.55, 1.8, 0] }, // bras R
        { g: [0.3, 1.1, 0.3], p: [-0.25, 0.6, 0] }, // jambe L
        { g: [0.3, 1.1, 0.3], p: [0.25, 0.6, 0] }   // jambe R
    ];

    parts.forEach(data => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(...data.g), mat);
        m.position.set(...data.p);
        group.add(m);
    });

    return group;
}

function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.PointLight(0x00d4ff, 1, 100);
    light.position.set(0, 50, 0);
    scene.add(light);

    buildMap();

    playerGroup = createPlayerMesh(0x00d4ff);
    scene.add(playerGroup);
    setupInputs();
    loop();
}

function buildMap() {
    // Sol RDC
    scene.add(new THREE.GridHelper(400, 40, 0x00d4ff, 0x111111));
    
    // Sol Étage 1
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.2, side: THREE.DoubleSide }));
    glass.rotation.x = -Math.PI / 2;
    glass.position.y = 29.9;
    scene.add(glass);

    // Murs (RDC et Étage)
    for(let i=0; i<40; i++) {
        let x = Math.random()*300-150, z = Math.random()*300-150;
        if(Math.abs(x)>15 || Math.abs(z)>15) {
            createWall(x, 0, z, 10, 2); // RDC
            createWall(x+20, 30, z+20, 2, 10); // Étage
        }
    }

    // Téléporteurs (Violets)
    createTeleporter(0, 0, 0, 30);      // Monter au centre
    createTeleporter(50, 30, 50, 0);    // Descendre
    createTeleporter(-50, 30, -50, 0);  // Descendre
}

function createWall(x, y, z, w, d) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 8, d), new THREE.MeshStandardMaterial({ color: 0x00d4ff }));
    wall.position.set(x, y + 4, z);
    scene.add(wall);
    walls.push({ minX: x-w/2-1, maxX: x+w/2+1, minZ: z-d/2-1, maxZ: z+d/2+1, minY: y, maxY: y+8 });
}

function createTeleporter(x, y, z, targetY) {
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.5, 32), new THREE.MeshStandardMaterial({ color: 0xd400ff, emissive: 0xd400ff }));
    pad.position.set(x, y + 0.2, z);
    scene.add(pad);
    teleporters.push({ x, y, z, targetY });
}

function updateRemote(d) {
    if(!otherPlayers[d.o]) { otherPlayers[d.o] = { mesh: createPlayerMesh(0xff0055) }; scene.add(otherPlayers[d.o].mesh); }
    otherPlayers[d.o].mesh.position.set(d.x, d.y, d.z);
    otherPlayers[d.o].mesh.rotation.y = d.ry;
}

function loop() {
    requestAnimationFrame(loop);
    const now = Date.now(), dt = 0.016;

    const move = new THREE.Vector3();
    if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));

    if(move.length() > 0) {
        const s = move.normalize().multiplyScalar(30 * dt);
        if(!checkWall(playerGroup.position.x + s.x, playerGroup.position.y, playerGroup.position.z)) playerGroup.position.x += s.x;
        if(!checkWall(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z + s.z)) playerGroup.position.z += s.z;
    }
    playerGroup.rotation.y = yaw;

    // Téléportation
    if(now - lastTeleport > 1500) {
        teleporters.forEach(tp => {
            if(Math.abs(playerGroup.position.y - tp.y) < 2 && playerGroup.position.distanceTo(new THREE.Vector3(tp.x, tp.y, tp.z)) < 3) {
                playerGroup.position.y = tp.targetY;
                lastTeleport = now;
                showNotif("TÉLÉPORTATION !");
            }
        });
    }

    if(now - lastSync > 100) {
        channel.publish('p', { t:'m', o:myID, x:playerGroup.position.x, y:playerGroup.position.y, z:playerGroup.position.z, ry:yaw });
        lastSync = now;
    }

    // Balles
    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * dt);
        if(b.o === myID) {
            for(let id in otherPlayers) {
                if(b.mesh.position.distanceTo(otherPlayers[id].mesh.position) < 2.5) {
                    channel.publish('p', { t:'h', o:myID, tgt:id, dmg:25 });
                    score += 10; document.getElementById('myScore').textContent = score;
                    scene.remove(b.mesh); bullets.splice(i,1); break;
                }
            }
        }
        if(bullets[i] && (now > b.death || checkWall(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z))) {
            scene.remove(b.mesh); bullets.splice(i,1);
        }
    }

    camera.position.set(playerGroup.position.x - Math.sin(yaw)*12, playerGroup.position.y + 8, playerGroup.position.z - Math.cos(yaw)*12);
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2, playerGroup.position.z);
    renderer.render(scene, camera);
}

function shoot() {
    if(Date.now() - lastShoot < 300) return;
    lastShoot = Date.now();
    const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.8, z:playerGroup.position.z, dx:Math.sin(yaw), dz:Math.cos(yaw), spd:120, col:0x00ff00 };
    channel.publish('p', d); createBullet(d);
}

function createBullet(d) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: d.col }));
    m.position.set(d.x, d.y, d.z); scene.add(m);
    bullets.push({ mesh:m, dir:new THREE.Vector3(d.dx,0,d.dz), speed:d.spd, o:d.o, death:Date.now()+1500 });
}

function takeDamage(dmg) {
    hp -= dmg; document.getElementById('health-bar').style.width = Math.max(0, hp) + "%";
    if(hp <= 0) { hp = 100; playerGroup.position.set(0,0,0); showNotif("RÉAPPARITION"); }
}

function checkWall(x, y, z) {
    return walls.some(w => y >= w.minY && y <= w.maxY && x > w.minX && x < w.maxX && z > w.minZ && z < w.maxZ);
}

function showNotif(t) { const n=document.getElementById('notif'); n.textContent=t; setTimeout(()=>n.textContent="", 2000); }

function setupInputs() {
    window.onkeydown = (e) => keysDown[e.code] = true;
    window.onkeyup = (e) => keysDown[e.code] = false;
    document.onmousemove = (e) => { if(document.pointerLockElement) yaw -= e.movementX * 0.003; };
    window.onmousedown = () => { if(document.pointerLockElement) shoot(); else renderer.domElement.requestPointerLock(); };
}
</script>
</body>
</html>
