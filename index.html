<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,"> <!-- Évite l'erreur favicon 404 -->
    <title>Neon Strike - Chromatica City</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-touch-callout: none; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 35px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; text-align: right; }
        #weapon-info { font-size: 14px; color: #fff; }
        #leaderboard { position: fixed; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); border: 1px solid #00d4ff; padding: 10px; width: 180px; font-family: monospace; z-index: 100; pointer-events: none; border-radius: 4px; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 14px; color: #00d4ff; border-bottom: 1px solid #00d4ff; padding-bottom: 5px; }
        .leader-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
        .is-me { color: #00d4ff; font-weight: bold; }
        #sniper-scope { position: fixed; inset: 0; border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 1000px #000; border: 2px solid #555; background: radial-gradient(circle, transparent 30%, #000 80%); z-index: 20; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #00fff2; border-radius: 50%; pointer-events: none; box-shadow: 0 0 5px #00fff2; z-index: 21; }
        #hit-marker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 24px; height: 24px; border: 3px solid #ff0055; opacity: 0; transition: opacity 0.1s; pointer-events: none; border-left: none; border-top: none; z-index: 22; }
        #reload-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #ff0055; font-weight: bold; display: none; text-shadow: 0 0 10px red; animation: blink 0.3s infinite; z-index: 25; }
        @keyframes blink { 50% { opacity: 0; } }
        #kill-feed { position: absolute; top: 150px; right: 20px; text-align: right; font-size: 14px; font-weight: bold; font-family: monospace; z-index: 10; }
        .kill-item { background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; margin-bottom: 2px; border-right: 3px solid #00d4ff; animation: fadeout 4s forwards; }
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; background: radial-gradient(circle at center, #112 0%, #000 100%); }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 1px solid #00d4ff; text-align: center; border-radius: 5px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); }
        button { padding: 15px 40px; background: linear-gradient(45deg, #00d4ff, #0088aa); border: none; font-weight: 900; letter-spacing: 2px; cursor: pointer; color: #000; transition: transform 0.1s; margin: 10px; }
        button:hover { transform: scale(1.05); filter: brightness(1.2); }
        #pause-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(8px); }
        .menu-box { background: #0a0a15; border: 2px solid #00d4ff; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
        .menu-box h2 { color: #00d4ff; letter-spacing: 5px; margin-bottom: 30px; }
        .menu-btn { width: 250px; display: block; margin: 15px auto; }
        .menu-btn.red { background: linear-gradient(45deg, #ff0055, #aa0033); }
        #mobile-controls { display: none; position: absolute; inset: 0; z-index: 50; pointer-events: none; }
        .touch-zone { position: absolute; bottom: 50px; width: 150px; height: 150px; pointer-events: auto; }
        #stick-container { left: 30px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; background: rgba(0,0,0,0.2); }
        #stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0, 212, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 40; }
        .mob-btn { position: absolute; width: 70px; height: 70px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation; user-select: none; }
        .mob-btn:active { background: #00d4ff; color: #000; transform: scale(0.9); }
        #btn-fire { bottom: 60px; right: 40px; width: 90px; height: 90px; border-color: #ff0055; background: rgba(255,0,85,0.2); font-size: 40px; z-index: 60; }
        #btn-jump { bottom: 180px; right: 40px; z-index: 60; }
        #btn-dash { bottom: 180px; right: 130px; border-color: #00ffcc; font-size: 20px; z-index: 60; }
        #btn-scope { bottom: 60px; right: 150px; font-size: 20px; z-index: 60; opacity: 0.3; }
        #btn-swap { bottom: 270px; right: 40px; font-size: 16px; border-color: #00ffcc; z-index: 60; }
        #btn-menu { top: 20px; left: 50%; transform: translateX(-50%); width: 100px; height: 40px; border-radius: 5px; font-size: 14px; border-color: #00d4ff; }
        #btn-invoke { bottom: 60px; left: 200px; border-color: #ffaa00; background: rgba(255, 170, 0, 0.2); color: #ffaa00; font-size: 24px; pointer-events: auto; z-index: 60; }
        #invoke-label { position: absolute; bottom: -25px; font-size: 10px; width: 100px; text-align: center; }
        #admin-console { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); border: 1px solid #ff0055; padding: 5px; z-index: 1000; display: none; }
        #admin-input { background: #000; border: 1px solid #ff0055; color: #0f0; width: 350px; font-family: monospace; outline: none; padding: 5px; }
    </style>
</head>
<body>

<div id="login"><div class="box"><h1>Neon <span style="color:#00d4ff">Strike</span></h1><p style="color:#888; margin-bottom:20px;">Chromatica City Update v2.2</p><button id="btn-conn" onclick="connectToCloud()">Déploiement</button></div></div>
<div id="pause-menu"><div class="menu-box"><h2>Pause</h2><button class="menu-btn" onclick="togglePause()">Reprendre</button><button class="menu-btn" onclick="alert('Z/Q/S/D: Bouger\nEspace: Sauter\nShift: Dash\n1-5: Armes\n@: Console Admin')">Commandes</button><button class="menu-btn red" onclick="location.reload()">Quitter</button></div></div>
<div id="ui"><div class="hud-panel"><div style="font-size:24px; font-weight:bold;">Score: <span id="score">0</span></div></div><br><div class="hud-panel"><div>Santé</div><div id="health-bar-bg"><div id="health-bar"></div></div></div></div>
<div id="leaderboard"><h3>Classement</h3><div id="leaderboard-list"></div></div>
<div id="ammo-box"><div id="weapon-info">--</div><span id="ammo-val">--</span> / <span id="ammo-max">--</span></div><div id="reload-msg">Rechargement...</div><div id="kill-feed"></div><div id="crosshair"></div><div id="sniper-scope"></div><div id="hit-marker"></div>
<div id="admin-console"><input type="text" id="admin-input" placeholder="Commande (help)..."></div>
<div id="mobile-controls"><div id="stick-container" class="touch-zone"><div id="stick"></div></div><div id="look-zone"></div><div id="btn-fire" class="mob-btn">🔥</div><div id="btn-jump" class="mob-btn">⬆️</div><div id="btn-dash" class="mob-btn">⚡</div><div id="btn-scope" class="mob-btn">🎯</div><div id="btn-swap" class="mob-btn">Swap</div><div id="btn-menu" class="mob-btn" onclick="togglePause()">Menu</div></div>
<div id="btn-invoke" class="mob-btn" onclick="invokeBot()" style="display:none;">🤖<div id="invoke-label">500 Pts</div></div>

<script>
const KEYS_CONFIG = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0, pitch = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], wallMeshes = [], bots = [], jumpPads = [], explosives = [], movingPlatforms = [];
let keysDown = {}, hp = 100, score = 0;
let lastShoot = 0, lastDash = 0, lastSync = 0;
let isReloading = false, isSniper = false, dashPower = 0;
let isPaused = false;
let audioCtx, vy = 0; 
let currentGravity = -55; let currentJumpForce = 24; let jumpCount = 0;
let playerSpeedBase = 32;
let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);
let touchMove = { x: 0, y: 0 }, isFiring = false;

let adminMode = false, isAimbot = false, isInvisible = false, infinityJumps = false, noDelay = false;

// Raycaster pour la caméra
const cameraRaycaster = new THREE.Raycaster();

const WEAPONS = [
    { name: "Mitraillette", ammo: 50, maxAmmo: 50, rate: 80, dmg: 6, speed: 220, color: 0xff00cc, spread: 0.05, count: 1, size: 0.6 },
    { name: "Fusil d'Assaut", ammo: 30, maxAmmo: 30, rate: 120, dmg: 14, speed: 190, color: 0x00ffcc, spread: 0, count: 1, size: 1 },
    { name: "Pompe de Combat", ammo: 8, maxAmmo: 8, rate: 850, dmg: 11, speed: 160, color: 0xffaa00, spread: 0.18, count: 8, size: 0.8 },
    { name: "Railgun Sniper", ammo: 5, maxAmmo: 5, rate: 1100, dmg: 95, speed: 450, color: 0xff00ff, spread: 0, count: 1, size: 1.2 },
    { name: "Canon Impulsion", ammo: 3, maxAmmo: 3, rate: 1800, dmg: 160, speed: 80, color: 0xff0033, spread: 0, count: 1, size: 4.0 }
];
let currentWeaponIdx = 0;

async function connectToCloud() {
    const btn = document.getElementById('btn-conn');
    btn.textContent = "Lancement..."; btn.disabled = true;
    myID = "NetRunner-" + Math.floor(Math.random()*999);
    initAudio(); 
    try {
        ably = new Ably.Realtime({ key: KEYS_CONFIG[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite-v2');
            channel.subscribe('p', handleMessage);
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Cloud Offline: " + e.message); btn.disabled = false; }
}

function handleMessage(m) {
    if (m.data.o === myID) return;
    const d = m.data;
    if (d.t === 'm') updateRemote(d);
    else if (d.t === 'f') { createBullet(d); playSound('laser', 0.2); }
    else if (d.t === 'h' && d.tgt === myID) { takeDamage(d.dmg, d.o); playSound('hit', 0.5); }
    else if (d.t === 'k') addKillFeed(d.killer, d.victim);
}

function initAudio() { 
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type, vol=0.1) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='shoot') { osc.type='square'; osc.frequency.setValueAtTime(160, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
    else if(type==='jump') { osc.type='sine'; osc.frequency.setValueAtTime(220, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(450, audioCtx.currentTime+0.1); gain.gain.setValueAtTime(vol, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime+0.2); }
    else if(type==='hit') { osc.type='sawtooth'; osc.frequency.setValueAtTime(80, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
    else { osc.type='sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); gain.gain.setValueAtTime(0.01, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime+0.01); }
}

function initGame() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05050a, 0.0025);
    camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 3000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x020205);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0x4040ff, 0.3));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(50, 200, 50); scene.add(sun);
    
    buildDiverseCity();
    addStars();
    
    playerGroup = createPlayerMesh(0x00d4ff, false); 
    playerGroup.position.set(0, 5, 0); 
    scene.add(playerGroup);
    
    for(let i=0; i<6; i++) spawnBot();
    switchWeapon(0); 
    setupInputs();

    if(isMobile) { document.getElementById('mobile-controls').style.display = 'block'; setupTouchControls(); }
    document.getElementById('btn-invoke').style.display = 'flex';
    
    loop();
}

function addStars() {
    const geo = new THREE.BufferGeometry();
    const pos = [];
    for(let i=0; i<2000; i++) {
        pos.push((Math.random()-0.5)*2000, Math.random()*1000, (Math.random()-0.5)*2000);
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({color: 0xffffff, size: 0.5});
    scene.add(new THREE.Points(geo, mat));
}

// --- ARCHITECTURE ---

function createSpiralStair(x, y, z, radius, totalHeight, color) {
    const stepsCount = 18;
    const stepH = totalHeight / stepsCount;
    for(let i=0; i < stepsCount; i++) {
        let angle = (i / stepsCount) * Math.PI * 1.5;
        let sx = x + Math.cos(angle) * radius;
        let sz = z + Math.sin(angle) * radius;
        createWall(sx, y + (i * stepH), sz, 5, 5, 0.8, color);
    }
}

function createDetailedBuilding(x, z, w, d, floors, baseColor) {
    const floorH = 14;
    for(let f=0; f<floors; f++) {
        let y = f * floorH;
        // Structure principale
        createWall(x, y, z, w, d, 0.5, 0x1a1a1a);
        createWall(x - w/2, y, z, 1, d, floorH, baseColor);
        createWall(x + w/2, y, z, 1, d, floorH, baseColor);
        createWall(x, y, z - d/2, w, 1, floorH, baseColor);
        createWall(x, y, z + d/2, w, 1, floorH, baseColor);
        
        // Fenêtres (Détail "Réaliste")
        for(let j=1; j<floorH-2; j+=4) {
            const winGeo = new THREE.PlaneGeometry(w-2, 1.5);
            const winMat = new THREE.MeshStandardMaterial({color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: Math.random()*2});
            const win = new THREE.Mesh(winGeo, winMat);
            win.position.set(x, y + j + 2, z + d/2 + 0.6);
            scene.add(win);
        }

        if(f < floors - 1) createSpiralStair(x - w/4, y, z - d/4, 6, floorH, 0x222222);
    }
    createWall(x, floors * floorH, z, w + 2, d + 2, 1, baseColor);
}

function createCyberTree(x, z) {
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(2, 10, 2), new THREE.MeshStandardMaterial({color: 0x111111}));
    trunk.position.set(x, 5, z); scene.add(trunk);
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8), new THREE.MeshStandardMaterial({color: 0x00ff66, emissive: 0x00ff66, emissiveIntensity: 0.5, wireframe: true}));
    leaves.position.set(x, 12, z); scene.add(leaves);
}

function buildDiverseCity() {
    // Sol avec grille
    const groundGeo = new THREE.PlaneGeometry(3000, 3000);
    const groundMat = new THREE.MeshStandardMaterial({color: 0x08080a});
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);
    
    const grid = new THREE.GridHelper(3000, 100, 0x00d4ff, 0x111122);
    grid.position.y = 0.05;
    scene.add(grid);

    walls.push({ minX: -1500, maxX: 1500, minZ: -1500, maxZ: 1500, minY: -1, maxY: 0 });

    createDetailedBuilding(0, -100, 50, 50, 3, 0x002244);
    createDetailedBuilding(80, -100, 40, 40, 2, 0x003366);
    createDetailedBuilding(-120, 50, 60, 40, 2, 0x442200);
    createDetailedBuilding(120, 50, 40, 40, 4, 0x113311);
    
    for(let i=0; i<15; i++) createCyberTree((Math.random()-0.5)*400, (Math.random()-0.5)*400);
    
    createBridge(40, 28, -100, 60, 8, 0);
    createBridge(-60, 14, 50, 80, 6, 0);
    
    for(let i=0; i<25; i++) {
        let x = (Math.random()-0.5)*600;
        let z = (Math.random()-0.5)*600;
        if(Math.abs(x)<50 && Math.abs(z)<50) x+=100;
        let h = 5 + Math.random()*15;
        createWall(x, 0, z, 8, 8, h, 0x1a1a20);
        if(Math.random()>0.7) createJumpPad(x, h, z);
    }
}

function createWall(x, y, z, w, d, h, color) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.8 });
    const m = new THREE.Mesh(geo, mat); 
    m.position.set(x, y + h/2, z); 
    scene.add(m);
    wallMeshes.push(m);
    walls.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y, maxY: y+h });
}

function createBridge(x, y, z, w, d, rotation = 0) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1, d), new THREE.MeshStandardMaterial({ color: 0x555555, emissive: 0x00d4ff, emissiveIntensity: 0.1 }));
    m.position.set(x, y, z);
    m.rotation.y = rotation;
    scene.add(m);
    wallMeshes.push(m);
    walls.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y-0.5, maxY: y+0.5 });
}

function createJumpPad(x, y, z) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 0.6, 16), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    m.position.set(x, y + 0.3, z);
    scene.add(m);
    jumpPads.push({ x, z, y, radius: 5 });
}

function createPlayerMesh(col, withHB = true) {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.5 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.8), mat); body.position.y = 0.9;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), mat); head.position.y = 2.1;
    g.add(body, head);
    if(withHB) {
        const hb = new THREE.Group();
        const f = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.2), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
        hb.add(f); hb.position.y = 3; g.add(hb); g.healthBar = f; g.healthBarGroup = hb;
    }
    return g;
}

function spawnBot(isAlly = false) {
    const bot = { 
        id: "Bot-" + Math.floor(Math.random()*9999), 
        mesh: createPlayerMesh(isAlly?0x00ffff:0xff5500), 
        hp: 100, maxHp: 100, vy: 0, lastShoot: 0, isAlly,
        dir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize()
    };
    bot.mesh.position.set((Math.random()-0.5)*200, 10, (Math.random()-0.5)*200);
    scene.add(bot.mesh); bots.push(bot);
}

function invokeBot() { if(score>=500 || adminMode) { if(!adminMode) score-=500; spawnBot(true); playSound('laser', 0.5); } }

function checkWall(x, y, z) {
    for(let w of walls) if(x>w.minX-0.6 && x<w.maxX+0.6 && z>w.minZ-0.6 && z<w.maxZ+0.6 && y>w.minY-0.1 && y<w.maxY) return true;
    return false;
}

function getFloorY(x, z, currentY) {
    let floor = 0;
    for(let w of walls) if(x>w.minX-0.6 && x<w.maxX+0.6 && z>w.minZ-0.6 && z<w.maxZ+0.6 && currentY >= w.maxY-1.5) floor = Math.max(floor, w.maxY);
    return floor;
}

function loop() {
    requestAnimationFrame(loop);
    if(isPaused) return;
    const now = Date.now(), dt = 0.016;

    if(isFiring) shoot();
    let moveSpeed = playerSpeedBase + dashPower; dashPower *= 0.9;
    const move = new THREE.Vector3();
    if(touchMove.x || touchMove.y) {
        move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)).multiplyScalar(-touchMove.y));
        move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).multiplyScalar(-touchMove.x));
    }
    if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    
    if(move.length()>0) {
        let s = move.normalize().multiplyScalar(moveSpeed*dt);
        if(!checkWall(playerGroup.position.x+s.x, playerGroup.position.y+1, playerGroup.position.z)) playerGroup.position.x+=s.x;
        if(!checkWall(playerGroup.position.x, playerGroup.position.y+1, playerGroup.position.z+s.z)) playerGroup.position.z+=s.z;
    }

    vy += currentGravity * dt;
    playerGroup.position.y += vy * dt;
    let ground = getFloorY(playerGroup.position.x, playerGroup.position.z, playerGroup.position.y);
    if(playerGroup.position.y <= ground) { playerGroup.position.y = ground; vy = 0; jumpCount = 0; }

    jumpPads.forEach(p => {
        if(Math.sqrt((playerGroup.position.x-p.x)**2 + (playerGroup.position.z-p.z)**2) < p.radius && Math.abs(playerGroup.position.y-p.y) < 2) { vy = 85; playSound('jump', 0.3); }
    });

    bots.forEach(b => {
        b.vy += currentGravity * dt; b.mesh.position.y += b.vy * dt;
        let bg = getFloorY(b.mesh.position.x, b.mesh.position.z, b.mesh.position.y);
        if(b.mesh.position.y <= bg) { b.mesh.position.y = bg; b.vy = 0; }
        b.mesh.healthBarGroup.lookAt(camera.position);
        const dist = b.mesh.position.distanceTo(playerGroup.position);
        if(!b.isAlly && dist < 60 && !isInvisible) {
            b.mesh.lookAt(playerGroup.position.x, b.mesh.position.y, playerGroup.position.z);
            if(now - b.lastShoot > 1200) {
                b.lastShoot = now;
                const dir = playerGroup.position.clone().add(new THREE.Vector3(0,1.5,0)).sub(b.mesh.position.clone().add(new THREE.Vector3(0,1.5,0))).normalize();
                createBullet({ t:'f', o:b.id, x:b.mesh.position.x, y:b.mesh.position.y+1.5, z:b.mesh.position.z, dx:dir.x, dy:dir.y, dz:dir.z, spd:130, dmg:8, col:0xffaa00, sz:1 });
            }
        } else {
            b.mesh.position.addScaledVector(b.dir, 12*dt);
            if(checkWall(b.mesh.position.x+b.dir.x, b.mesh.position.y+1, b.mesh.position.z+b.dir.z)) b.dir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
        }
    });

    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed*dt);
        if(checkWall(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z)) { scene.remove(b.mesh); bullets.splice(i,1); continue; }
        if(b.o === myID) {
            bots.forEach((bot, bi) => {
                if(!bot.isAlly && b.mesh.position.distanceTo(bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0))) < 2.5) {
                    bot.hp -= b.dmg; triggerHitMarker(); scene.remove(b.mesh); bullets.splice(i,1);
                    bot.mesh.healthBar.scale.x = Math.max(0, bot.hp/100);
                    if(bot.hp <= 0) { scene.remove(bot.mesh); bots.splice(bi,1); score += 100; addKillFeed("Toi", "Bot"); setTimeout(spawnBot, 3000); }
                }
            });
        } else {
            if(b.mesh.position.distanceTo(playerGroup.position.clone().add(new THREE.Vector3(0,1.2,0))) < 2) {
                takeDamage(b.dmg, b.o); scene.remove(b.mesh); bullets.splice(i,1);
            }
        }
    }

    if(now - lastSync > 50) { 
        channel.publish('p', { t:'m', o:myID, x:playerGroup.position.x, y:playerGroup.position.y, z:playerGroup.position.z, ry:yaw, score, hp }); 
        lastSync = now; updateLeaderboard(); 
    }

    // --- MISE A JOUR CAMERA ANTI-BUG (COLLISION) ---
    let cp = isSniper ? pitch : 0;
    let idealOffset = new THREE.Vector3(-Math.sin(yaw)*15, (isSniper?1.8:10), -Math.cos(yaw)*15);
    let camPos = playerGroup.position.clone().add(idealOffset);
    
    // Raycasting pour éviter les murs derrière
    const rayDir = idealOffset.clone().normalize();
    cameraRaycaster.set(playerGroup.position.clone().add(new THREE.Vector3(0, 2, 0)), rayDir);
    const intersects = cameraRaycaster.intersectObjects(wallMeshes);
    
    if (intersects.length > 0 && intersects[0].distance < 15) {
        camPos = playerGroup.position.clone().add(new THREE.Vector3(0, 2, 0)).add(rayDir.multiplyScalar(intersects[0].distance * 0.8));
    }

    camera.position.lerp(camPos, 0.2);
    camera.lookAt(playerGroup.position.x + Math.sin(yaw)*Math.cos(cp), playerGroup.position.y + (isSniper?1.8:6) + Math.sin(cp), playerGroup.position.z + Math.cos(yaw)*Math.cos(cp));
    renderer.render(scene, camera);
}

function shoot() {
    const w = WEAPONS[currentWeaponIdx];
    if(!w || isReloading || (Date.now()-lastShoot < (noDelay?50:w.rate))) return;
    if(!adminMode && w.ammo <= 0) { reload(); return; }
    if(!adminMode) w.ammo--; 
    lastShoot = Date.now(); playSound('shoot', 0.2);
    document.getElementById('ammo-val').textContent = adminMode ? "∞" : w.ammo;
    let cp = isSniper ? pitch : 0;
    for(let i=0; i<w.count; i++) {
        let sp = (Math.random()-0.5) * w.spread;
        let dir = new THREE.Vector3(Math.sin(yaw+sp)*Math.cos(cp), Math.sin(cp), Math.cos(yaw+sp)*Math.cos(cp));
        if(isAimbot) {
            let target = null, minDist = 200;
            bots.forEach(b => { if(!b.isAlly) { let d = playerGroup.position.distanceTo(b.mesh.position); if(d < minDist) { minDist=d; target=b; } } });
            if(target) dir.subVectors(target.mesh.position.clone().add(new THREE.Vector3(0,1.5,0)), playerGroup.position.clone().add(new THREE.Vector3(0,1.5,0))).normalize();
        }
        const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.6, z:playerGroup.position.z, dx:dir.x, dy:dir.y, dz:dir.z, spd:w.speed, dmg:w.dmg, col:w.color, sz:w.size };
        channel.publish('p', d); createBullet(d);
    }
}

function reload() { if(isReloading) return; isReloading=true; document.getElementById('reload-msg').style.display='block'; setTimeout(() => { WEAPONS[currentWeaponIdx].ammo=WEAPONS[currentWeaponIdx].maxAmmo; document.getElementById('ammo-val').textContent=WEAPONS[currentWeaponIdx].ammo; document.getElementById('reload-msg').style.display='none'; isReloading=false; }, 1200); }
function takeDamage(d, id) { if(adminMode) return; hp -= d; document.getElementById('health-bar').style.width = Math.max(0, hp) + "%"; if(hp <= 0) { hp = 100; playerGroup.position.set(0, 50, 0); addKillFeed(id, "Toi"); } }
function createBullet(d) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.4*d.sz, 0.4*d.sz, 1.2*d.sz), new THREE.MeshBasicMaterial({color:d.col})); m.position.set(d.x,d.y,d.z); m.lookAt(d.x+d.dx, d.y+d.dy, d.z+d.dz); scene.add(m); bullets.push({mesh:m, dir:new THREE.Vector3(d.dx,d.dy,d.dz), speed:d.spd, dmg:d.dmg, o:d.o}); }
function jump() { if(jumpCount < 2 || infinityJumps) { vy = currentJumpForce; jumpCount++; playSound('jump', 0.2); } }
function dash() { if(Date.now()-lastDash > 1200) { lastDash=Date.now(); dashPower=90; } }
function toggleScope() { if(currentWeaponIdx===3){ isSniper=!isSniper; camera.fov=isSniper?12:80; camera.updateProjectionMatrix(); document.getElementById('sniper-scope').style.display=isSniper?'block':'none'; playerGroup.visible=!isSniper; } }
function triggerHitMarker() { const hm=document.getElementById('hit-marker'); hm.style.opacity=1; setTimeout(()=>hm.style.opacity=0, 80); }
function addKillFeed(k,v) { const d=document.createElement('div'); d.className='kill-item'; d.innerHTML=`${k} ➔ ${v}`; document.getElementById('kill-feed').prepend(d); }

function switchWeapon(i) { 
    if (i < 0 || i >= WEAPONS.length) return; 
    currentWeaponIdx = i; 
    const w = WEAPONS[i]; 
    document.getElementById('weapon-info').textContent = w.name; 
    document.getElementById('ammo-val').textContent = w.ammo; 
    document.getElementById('ammo-max').textContent = w.maxAmmo; 
    isSniper = false; camera.fov = 80; camera.updateProjectionMatrix(); 
    document.getElementById('sniper-scope').style.display = 'none'; 
    playerGroup.visible = true; 
}

function togglePause() { isPaused=!isPaused; document.getElementById('pause-menu').style.display=isPaused?'flex':'none'; if(!isPaused && !isMobile) renderer.domElement.requestPointerLock(); else document.exitPointerLock(); }
function updateLeaderboard() { let p = [{id:"Toi", s:score, me:true}]; for(let id in otherPlayers) p.push({id, s:otherPlayers[id].score, me:false}); p.sort((a,b)=>b.s-a.s); document.getElementById('leaderboard-list').innerHTML = p.slice(0,5).map(x=>`<div class="leader-item ${x.me?'is-me':''}"><span>${x.id}</span><span>${x.s}</span></div>`).join(''); }
function updateRemote(d) { if(!otherPlayers[d.o]){ otherPlayers[d.o]={mesh:createPlayerMesh(0xff0055), score:0}; scene.add(otherPlayers[d.o].mesh); } otherPlayers[d.o].mesh.position.lerp(new THREE.Vector3(d.x,d.y,d.z), 0.2); otherPlayers[d.o].mesh.rotation.y = d.ry; otherPlayers[d.o].score = d.score; otherPlayers[d.o].mesh.healthBar.scale.x = d.hp/100; otherPlayers[d.o].mesh.healthBarGroup.lookAt(camera.position); }
function startFire() { if(!isPaused) { initAudio(); isFiring = true; } }
function stopFire() { isFiring = false; }

function handleAdmin(cmd) {
    const p = cmd.toLowerCase().split(' ');
    if(p[0]==='aimbot') isAimbot = !isAimbot;
    if(p[0]==='god') adminMode = !adminMode;
    if(p[0]==='speed') playerSpeedBase = parseInt(p[1]) || 32;
    if(p[0]==='spawn') { for(let i=0; i<(parseInt(p[1])||1); i++) spawnBot(); }
}

function setupInputs() {
    window.onkeydown=e=>{ 
        if(e.code==='Escape') togglePause();
        if(e.key==='@') { const c=document.getElementById('admin-console'); c.style.display=c.style.display==='none'?'block':'none'; if(c.style.display==='block') document.getElementById('admin-input').focus(); }
        if(document.activeElement.id==='admin-input' && e.code==='Enter') { handleAdmin(document.activeElement.value); document.activeElement.value=''; }
        if(isPaused) return;
        keysDown[e.code]=true;
        if(e.code==='Space') jump(); if(e.code==='KeyR') reload(); if(e.code==='ShiftLeft') dash();
        if(e.code.startsWith('Digit')) {
            const num = parseInt(e.code.slice(-1));
            if(num >= 1 && num <= 5) switchWeapon(num - 1);
        }
    };
    window.onkeyup=e=>keysDown[e.code]=false;
    document.onmousemove=e=>{ if(document.pointerLockElement && !isPaused){ yaw-=e.movementX*0.003; if(isSniper){ pitch-=e.movementY*0.003; pitch=Math.max(-1.5, Math.min(1.5, pitch)); } } };
    window.onmousedown=e=>{ if(!isPaused){ if(document.pointerLockElement){ if(e.button===0) startFire(); if(e.button===2) toggleScope(); } else renderer.domElement.requestPointerLock(); } };
    window.onmouseup=e=>{ if(e.button===0) stopFire(); };
}

function setupTouchControls() {
    const sz=document.getElementById('stick-container'), lz=document.getElementById('look-zone');
    sz.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0], r=sz.getBoundingClientRect(), dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2); touchMove={x:Math.max(-1,Math.min(1,dx/50)), y:Math.max(-1,Math.min(1,dy/50))}; document.getElementById('stick').style.transform=`translate(calc(-50% + ${touchMove.x*50}px), calc(-50% + ${touchMove.y*50}px))`; }, {passive:false});
    sz.addEventListener('touchend', ()=>{ touchMove={x:0,y:0}; document.getElementById('stick').style.transform=`translate(-50%,-50%)`; });
    let lx=0, ly=0; lz.addEventListener('touchstart', e=>{ lx=e.touches[0].clientX; ly=e.touches[0].clientY; });
    lz.addEventListener('touchmove', e=>{ const tx=e.touches[0].clientX, ty=e.touches[0].clientY; yaw-=(tx-lx)*0.008; if(isSniper){ pitch-=(ty-ly)*0.008; pitch=Math.max(-1.5,1.5,pitch); } lx=tx; ly=ty; }, {passive:false});
    document.getElementById('btn-fire').addEventListener('touchstart', startFire); document.getElementById('btn-fire').addEventListener('touchend', stopFire);
    document.getElementById('btn-jump').addEventListener('touchstart', jump); document.getElementById('btn-dash').addEventListener('touchstart', dash);
    document.getElementById('btn-scope').addEventListener('touchstart', toggleScope); document.getElementById('btn-swap').addEventListener('touchstart', ()=>switchWeapon((currentWeaponIdx+1)%5));
}
</script>
