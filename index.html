<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - Bullet Fix Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 35px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; text-align: right; }
        #weapon-info { font-size: 14px; color: #fff; text-transform: uppercase; }
        #heli-ui { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,255,100,0.3); border: 2px solid #0f0; padding: 10px; display: none; color: #0f0; font-family: monospace; font-weight: bold; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border: 2px solid #00fff2; border-radius: 50%; pointer-events: none; z-index: 21; }
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 2px solid #00d4ff; text-align: center; border-radius: 10px; }
        button { padding: 15px 40px; background: #00d4ff; border: none; font-weight: 900; cursor: pointer; color: #000; text-transform: uppercase; }
        #kill-feed { position: absolute; top: 150px; right: 20px; text-align: right; font-size: 14px; font-family: monospace; z-index: 10; }
        .kill-item { background: rgba(0,0,0,0.8); color: #fff; padding: 5px 10px; margin-bottom: 2px; border-right: 3px solid #00d4ff; }
    </style>
</head>
<body>

<div id="login"><div class="box"><h1>NEON <span style="color:#00d4ff">CITY</span></h1><p>FIX MUNITIONS & VISÉE VERTICALE</p><button onclick="connectToCloud()">DÉPLOYER</button></div></div>

<div id="ui">
    <div class="hud-panel"><div>SCORE: <span id="score">0</span></div></div><br>
    <div class="hud-panel"><div>SANTÉ</div><div id="health-bar-bg"><div id="health-bar"></div></div></div>
</div>

<div id="heli-ui">PILOTAGE HÉLICO : ZSQD + ESPACE / SHIFT</div>
<div id="ammo-box"><div id="weapon-info">MITRAILLETTE</div><span id="ammo-val">50</span> / <span id="ammo-max">50</span></div>
<div id="kill-feed"></div>
<div id="crosshair"></div>

<script>
const KEYS_CONFIG = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0, pitch = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], bots = [];
let keysDown = {}, hp = 100, score = 0, lastShoot = 0, isAdmin = false;
let audioCtx, vy = 0, jumpCount = 0;
const GRAVITY = -55, JUMP_FORCE = 24;

let heliGroup, rotor, isPiloting = false, heliVelocity = new THREE.Vector3();

// --- ADMIN COMMANDS ---
window.admin = function() {
    isAdmin = !isAdmin;
    if(isAdmin) {
        hp = 100;
        document.getElementById('health-bar').style.width = "100%";
        document.getElementById('ammo-val').textContent = "∞";
        addKillFeed("SYSTEM", "GOD MODE ACTIVÉ");
    } else {
        switchWeapon(currentWeaponIdx);
    }
    return "Admin Status: " + isAdmin;
};

const WEAPONS = [
    { name: "Mitraillette", ammo: 50, maxAmmo: 50, rate: 100, dmg: 10, speed: 300, color: 0x00ffff, size: 0.4 },
    { name: "Railgun", ammo: 5, maxAmmo: 5, rate: 800, dmg: 100, speed: 600, color: 0xff00ff, size: 0.8 }
];
let currentWeaponIdx = 0;

async function connectToCloud() {
    myID = "Ghost-" + Math.floor(Math.random()*999);
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try {
        ably = new Ably.Realtime({ key: KEYS_CONFIG[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite');
            channel.subscribe('p', handleMessage);
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur Ably"); }
}

function handleMessage(m) {
    if (m.data.o === myID) return;
    const d = m.data;
    if (d.t === 'f') createBullet(d);
    else if (d.t === 'h' && d.tgt === myID) takeDamage(d.dmg, d.o);
}

function initGame() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02050a, 0.005);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x02050a);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 0.5); sun.position.set(50, 100, 50); scene.add(sun);
    
    buildStructuredCity();
    createHeli();
    
    playerGroup = createPlayerMesh(0x00d4ff); 
    playerGroup.position.set(0, 42, 0); 
    scene.add(playerGroup);
    
    for(let i=0; i<8; i++) spawnBot();
    
    setupInputs();
    loop();
}

function buildStructuredCity() {
    const groundGeo = new THREE.PlaneGeometry(2000, 2000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0a15 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    createWall(0, 0, 0, 20, 20, 40, 0x0088ff); // Tour centrale

    for(let x = -5; x <= 5; x++) {
        for(let z = -5; z <= 5; z++) {
            if(x === 0 && z === 0) continue;
            const h = 15 + Math.random() * 60;
            createWall(x * 60, 0, z * 60, 30, 30, h, 0x151525);
        }
    }
}

function createWall(x, y, z, w, d, h, color) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color })); 
    m.position.set(x, y + h/2, z); 
    scene.add(m);
    walls.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y, maxY: y+h });
}

function createPlayerMesh(col) {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshStandardMaterial({ color: col }));
    b.position.y = 1;
    g.add(b);
    return g;
}

function spawnBot() {
    const bot = { 
        id: "Bot-" + Math.floor(Math.random()*1000), 
        mesh: createPlayerMesh(0xff3300), 
        hp: 100, 
        lastShoot: 0,
        dir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize()
    };
    bot.mesh.position.set((Math.random()-0.5)*400, 1, (Math.random()-0.5)*400);
    scene.add(bot.mesh);
    bots.push(bot);
}

function checkWall(x, z, y) {
    for (let w of walls) {
        if (x > w.minX - 0.6 && x < w.maxX + 0.6 && z > w.minZ - 0.6 && z < w.maxZ + 0.6) {
            if (y < w.maxY) return true;
        }
    }
    return false;
}

function getFloorY(x, z, currentY) {
    let floor = 0;
    for (let w of walls) {
        if (x > w.minX - 0.6 && x < w.maxX + 0.6 && z > w.minZ - 0.6 && z < w.maxZ + 0.6) {
            if (currentY >= w.maxY - 1) floor = Math.max(floor, w.maxY);
        }
    }
    return floor;
}

function loop() {
    requestAnimationFrame(loop);
    const dt = 0.016;
    const now = Date.now();

    if(!isPiloting) {
        const move = new THREE.Vector3();
        if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        
        if(move.length() > 0) {
            const speed = 40 * dt;
            const nextX = playerGroup.position.x + move.normalize().x * speed;
            const nextZ = playerGroup.position.z + move.normalize().z * speed;
            if(!checkWall(nextX, playerGroup.position.z, playerGroup.position.y + 1)) playerGroup.position.x = nextX;
            if(!checkWall(playerGroup.position.x, nextZ, playerGroup.position.y + 1)) playerGroup.position.z = nextZ;
        }

        vy += GRAVITY * dt;
        playerGroup.position.y += vy * dt;
        let ground = getFloorY(playerGroup.position.x, playerGroup.position.z, playerGroup.position.y);
        if(playerGroup.position.y <= ground) { playerGroup.position.y = ground; vy = 0; jumpCount = 0; }
        
        camera.position.set(playerGroup.position.x, playerGroup.position.y + 1.7, playerGroup.position.z);
        camera.rotation.set(pitch, yaw + Math.PI, 0, 'YXZ');
    } else {
        rotor.rotation.y += 0.6;
        if(keysDown['KeyW']) heliVelocity.add(new THREE.Vector3(Math.sin(heliGroup.rotation.y), 0, Math.cos(heliGroup.rotation.y)).multiplyScalar(1.2));
        if(keysDown['KeyS']) heliVelocity.sub(new THREE.Vector3(Math.sin(heliGroup.rotation.y), 0, Math.cos(heliGroup.rotation.y)).multiplyScalar(1.2));
        if(keysDown['KeyA']) heliGroup.rotation.y += 0.04;
        if(keysDown['KeyD']) heliGroup.rotation.y -= 0.04;
        if(keysDown['Space']) heliVelocity.y += 1.0;
        if(keysDown['ShiftLeft']) heliVelocity.y -= 1.0;
        
        heliVelocity.multiplyScalar(0.96);
        heliGroup.position.add(heliVelocity.clone().multiplyScalar(dt * 10));
        playerGroup.position.copy(heliGroup.position);
        camera.position.set(heliGroup.position.x - Math.sin(heliGroup.rotation.y)*20, heliGroup.position.y + 10, heliGroup.position.z - Math.cos(heliGroup.rotation.y)*20);
        camera.lookAt(heliGroup.position);
    }

    // Mise à jour des balles (Mouvement corrigé)
    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i];
        const step = b.dir.clone().multiplyScalar(b.speed * dt);
        b.mesh.position.add(step);

        // Collision Bots
        for(let j=bots.length-1; j>=0; j--) {
            if(b.o === myID && b.mesh.position.distanceTo(bots[j].mesh.position) < 2) {
                scene.remove(bots[j].mesh); bots.splice(j, 1);
                scene.remove(b.mesh); bullets.splice(i, 1);
                score += 100; document.getElementById('score').textContent = score;
                addKillFeed("TOI", "BOT");
                break;
            }
        }
        
        // Collision Joueur
        if(b.o !== myID && b.mesh.position.distanceTo(playerGroup.position) < 1.5) {
            takeDamage(b.dmg, b.o); scene.remove(b.mesh); bullets.splice(i, 1);
        } else if(b.mesh.position.length() > 1500) {
            scene.remove(b.mesh); bullets.splice(i, 1);
        }
    }

    renderer.render(scene, camera);
}

function createHeli() {
    heliGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 6), new THREE.MeshStandardMaterial({color: 0x444444}));
    rotor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 0.5), new THREE.MeshStandardMaterial({color: 0x000000}));
    rotor.position.y = 1.5;
    heliGroup.add(body, rotor);
    heliGroup.position.set(0, 41, -5);
    scene.add(heliGroup);
}

function shoot() {
    const w = WEAPONS[currentWeaponIdx];
    if(!isAdmin && w.ammo <= 0) return;
    if(Date.now() - lastShoot < w.rate) return;
    lastShoot = Date.now();
    if(!isAdmin) { w.ammo--; document.getElementById('ammo-val').textContent = w.ammo; }

    // Calcul de la direction face caméra
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
    const data = { t:'f', o:myID, x:camera.position.x, y:camera.position.y, z:camera.position.z, dx:dir.x, dy:dir.y, dz:dir.z, spd:w.speed, dmg:w.dmg, col:w.color, sz:w.size };
    if(channel) channel.publish('p', data); 
    createBullet(data);
}

function createBullet(d) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(d.sz), new THREE.MeshBasicMaterial({color: d.col}));
    m.position.set(d.x, d.y, d.z);
    scene.add(m);
    bullets.push({mesh:m, dir:new THREE.Vector3(d.dx, d.dy, d.dz), speed:d.spd, dmg:d.dmg, o:d.o});
}

function takeDamage(d, killer) { 
    if(isAdmin) return;
    hp -= d; 
    document.getElementById('health-bar').style.width = hp + "%"; 
    if(hp<=0) { hp=100; playerGroup.position.set(0,42,0); addKillFeed(killer, "Toi"); }
}

function addKillFeed(k,v) { 
    const d=document.createElement('div'); d.className='kill-item'; d.innerHTML=`<b>${k}</b> > ${v}`; 
    document.getElementById('kill-feed').prepend(d); 
}

function switchWeapon(i) { 
    currentWeaponIdx=i; 
    document.getElementById('weapon-info').textContent=WEAPONS[i].name;
    document.getElementById('ammo-val').textContent = isAdmin ? "∞" : WEAPONS[i].ammo;
}

function setupInputs() {
    window.onkeydown=e=>{ 
        keysDown[e.code]=true;
        if(e.code==='KeyE' && playerGroup.position.distanceTo(heliGroup.position) < 8) {
            isPiloting = !isPiloting;
            document.getElementById('heli-ui').style.display = isPiloting ? 'block' : 'none';
        }
        if(e.code==='Space' && !isPiloting && jumpCount < 2) { vy = JUMP_FORCE; jumpCount++; }
        if(e.code.startsWith('Digit')) switchWeapon(parseInt(e.code.slice(-1))-1);
    };
    window.onkeyup=e=>keysDown[e.code]=false;
    document.onmousemove=e=>{ 
        if(document.pointerLockElement) {
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch));
        }
    };
    window.onmousedown=e=>{ if(document.pointerLockElement) shoot(); else renderer.domElement.requestPointerLock(); };
}
</script>
</body>
</html>
