<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - Synchronized Ops</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Courier New', monospace; user-select: none; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 12px; border: 2px solid #00d4ff; border-radius: 8px; z-index: 10; pointer-events: none; }
        #health-bar-container { width: 150px; height: 10px; background: #333; border: 1px solid #fff; margin-top: 5px; }
        #health-bar { width: 100%; height: 100%; background: #ff0055; transition: width 0.3s; }
        #shop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 20, 0.95); border: 3px solid #ffeb3b; padding: 20px; border-radius: 15px; display: none; z-index: 200; text-align: center; min-width: 300px; }
        .shop-item { background: rgba(255,255,255,0.1); margin: 10px 0; padding: 15px; border-radius: 8px; border: 1px solid #444; cursor: pointer; }
        .shop-item.locked { opacity: 0.5; cursor: not-allowed; }
        #notif { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); color: #ffeb3b; font-weight: bold; z-index: 100; font-size: 20px; text-shadow: 0 0 10px #ffeb3b; text-align: center; }
        #mobile-controls { display: none; }
        @media (pointer: coarse) {
            #mobile-controls { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 50; }
            #joystick-base { position: absolute; bottom: 30px; left: 30px; width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px solid #00d4ff; border-radius: 50%; pointer-events: auto; }
            #joystick-stick { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: #00d4ff; border-radius: 50%; }
            #mobile-btns { position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
            .m-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: rgba(0,212,255,0.3); color: white; font-weight: bold; font-size: 10px; border: 1px solid #00d4ff; }
        }
    </style>
</head>
<body>

<div id="login" style="position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:1000;">
    <div style="text-align:center; border:2px solid #00d4ff; padding:40px; border-radius:20px;">
        <h1 style="color:#00d4ff">NEON STRIKE : SYNC</h1>
        <button onclick="connectToCloud()" style="padding:15px 40px; background:#00d4ff; border:none; font-weight:bold; cursor:pointer; border-radius:5px;">LANCER</button>
    </div>
</div>

<div id="notif"></div>

<div id="shop">
    <h2 style="color:#ffeb3b">SHOP ARTEFACTS</h2>
    <p>Points : <span id="shop-points">0</span> | Kills : <span id="shop-kills">0</span></p>
    <div class="shop-item" onclick="buyArtifact('staff')">Bâton de Vie (50 pts)</div>
    <div id="bot-item" class="shop-item locked" onclick="buyArtifact('bot')">Invoquer Drone (5 Kills)</div>
    <button onclick="toggleShop()" style="margin-top:10px; width:100%;">FERMER</button>
</div>

<div id="ui">
    <div>SCORE: <span id="myScore">0</span> | KILLS: <span id="myKills">0</span></div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
</div>

<div id="mobile-controls">
    <div id="joystick-base"><div id="joystick-stick"></div></div>
    <div id="mobile-btns">
        <button class="m-btn" onclick="toggleShop()">SHOP</button>
        <button class="m-btn" onclick="toggleInvis()">👻</button>
        <button class="m-btn" id="m-shoot" style="background:rgba(255,0,85,0.5); width:70px; height:70px;">FEU</button>
    </div>
</div>

<script>
const KEYS = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], myBots = [], otherBots = {}, keysDown = {};
let hp = 100, score = 0, kills = 0, lastShoot = 0, lastSync = 0, isInvisible = false, hasStaff = false, shopOpen = false;
let mobileMove = {x:0, y:0};

async function connectToCloud() {
    myID = "P-" + Math.random().toString(36).substr(2, 3).toUpperCase();
    try {
        ably = new Ably.Realtime({ key: KEYS[0], clientId: myID });
        channel = ably.channels.get('neon-arena-sync');
        
        channel.subscribe('p', (m) => {
            const d = m.data;
            if (d.o === myID) return;

            if (d.t === 'm') updateRemotePlayer(d);
            else if (d.t === 'f') createBullet(d); // Synchronisation des balles
            else if (d.t === 'h' && d.tgt === myID) takeDamage(d.dmg, d.o);
            else if (d.t === 'k' && d.killer === myID) { kills++; score += 50; showNotif("KILL CONFIRMÉ ! +50"); updateUI(); }
            else if (d.t === 'bm') updateRemoteBot(d); // Synchronisation des bots
        });

        await channel.presence.enter();
        initGame();
        document.getElementById('login').style.display = 'none';
    } catch (e) { alert("Erreur réseau"); }
}

function createPlayerMesh(col, isBot = false) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4, transparent: true });
    const parts = [
        new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), mat), // tête
        new THREE.Mesh(new THREE.BoxGeometry(0.7,1.1,0.4), mat), // torse
        new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2), mat), // bras L
        new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2), mat), // bras R
        new THREE.Mesh(new THREE.BoxGeometry(0.25,1,0.25), mat), // jambe L
        new THREE.Mesh(new THREE.BoxGeometry(0.25,1,0.25), mat)  // jambe R
    ];
    parts[0].position.y = 2.6; parts[1].position.y = 1.8;
    parts[2].position.set(-0.5,1.8,0); parts[3].position.set(0.5,1.8,0);
    parts[4].position.set(-0.2,0.6,0); parts[5].position.set(0.2,0.6,0);
    if(isBot) { const ant = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.6,0.1), mat); ant.position.y = 3; group.add(ant); }
    group.add(...parts);
    return group;
}

function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.GridHelper(400, 80, 0x00d4ff, 0x111111));
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    playerGroup = createPlayerMesh(0x00d4ff);
    scene.add(playerGroup);
    setupInputs();
    loop();
}

function updateRemotePlayer(d) {
    if(!otherPlayers[d.o]) {
        otherPlayers[d.o] = { mesh: createPlayerMesh(0xff0055) };
        scene.add(otherPlayers[d.o].mesh);
    }
    otherPlayers[d.o].mesh.position.set(d.x, 0, d.z);
    otherPlayers[d.o].mesh.rotation.y = d.y;
    otherPlayers[d.o].mesh.children.forEach(c => c.material.opacity = d.i ? 0.1 : 1);
}

function updateRemoteBot(d) {
    if(!otherBots[d.bid]) {
        otherBots[d.bid] = { mesh: createPlayerMesh(0xffeb3b, true) };
        scene.add(otherBots[d.bid].mesh);
    }
    otherBots[d.bid].mesh.position.set(d.x, 0, d.z);
    otherBots[d.bid].mesh.rotation.y = d.y;
}

function loop() {
    requestAnimationFrame(loop);
    const now = Date.now(), dt = 0.016;

    // Déplacement Joueur
    const move = new THREE.Vector3();
    if(keysDown['KeyW'] || mobileMove.y < -0.3) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS'] || mobileMove.y > 0.3) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA'] || mobileMove.x < -0.3) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD'] || mobileMove.x > 0.3) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(move.length() > 0) playerGroup.position.add(move.normalize().multiplyScalar(35 * dt));
    playerGroup.rotation.y = yaw;

    // IA et Sync des Bots (Tes propres clones)
    myBots.forEach(bot => {
        let closest = null, minDist = 100;
        for(let id in otherPlayers) {
            let d = bot.mesh.position.distanceTo(otherPlayers[id].mesh.position);
            if(d < minDist) { minDist = d; closest = otherPlayers[id].mesh; }
        }
        if(closest) {
            bot.mesh.lookAt(closest.position);
            bot.mesh.translateZ(15 * dt);
            if(now - bot.lastShoot > 1000) {
                const dir = new THREE.Vector3().subVectors(closest.position, bot.mesh.position).normalize();
                const bData = { t:'f', o:myID, x:bot.mesh.position.x, y:1.8, z:bot.mesh.position.z, dx:dir.x, dz:dir.z, col:0xffeb3b, spd:80, dmg:10 };
                channel.publish('p', bData); createBullet(bData);
                bot.lastShoot = now;
            }
        }
        // Sync du bot aux autres
        channel.publish('p', { t:'bm', bid:bot.id, x:bot.mesh.position.x, z:bot.mesh.position.z, y:bot.mesh.rotation.y, o:myID });
    });

    // Synchronisation Joueur
    if(now - lastSync > 100) {
        channel.publish('p', { t:'m', o:myID, x:playerGroup.position.x, z:playerGroup.position.z, y:yaw, i:isInvisible });
        lastSync = now;
    }

    // Gestion des balles (Collision locale)
    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * dt);
        if(b.o === myID) { // Si c'est MA balle, je vérifie si je touche quelqu'un
            for(let id in otherPlayers) {
                if(b.mesh.position.distanceTo(otherPlayers[id].mesh.position) < 2.5) {
                    channel.publish('p', { t:'h', o:myID, tgt:id, dmg:b.dmg });
                    score += 5; updateUI();
                    scene.remove(b.mesh); bullets.splice(i,1); break;
                }
            }
        }
        if(bullets[i] && now > b.death) { scene.remove(b.mesh); bullets.splice(i,1); }
    }

    camera.position.set(playerGroup.position.x - Math.sin(yaw)*15, 12, playerGroup.position.z - Math.cos(yaw)*15);
    camera.lookAt(playerGroup.position);
    renderer.render(scene, camera);
}

function shoot() {
    if(Date.now() - lastShoot < 300 || isInvisible) return;
    lastShoot = Date.now();
    const bData = { t:'f', o:myID, x:playerGroup.position.x, y:1.8, z:playerGroup.position.z, dx:Math.sin(yaw), dz:Math.cos(yaw), col:0x00ff00, spd:120, dmg:20 };
    channel.publish('p', bData); // On envoie la balle aux autres
    createBullet(bData); // On la crée chez nous
}

function createBullet(d) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: d.col }));
    m.position.set(d.x, d.y, d.z); scene.add(m);
    bullets.push({ mesh:m, dir:new THREE.Vector3(d.dx,0,d.dz), speed:d.spd, dmg:d.dmg, o:d.o, death:Date.now()+2000 });
}

function takeDamage(dmg, attackerID) {
    hp -= dmg; document.getElementById('health-bar').style.width = hp + "%";
    if(hp <= 0) {
        if(hasStaff) { hp=100; hasStaff=false; showNotif("RESSUSCITÉ !"); }
        else {
            showNotif("MORT !");
            channel.publish('p', { t:'k', killer:attackerID, victim:myID });
            hp=100; playerGroup.position.set(Math.random()*40-20,0,Math.random()*40-20);
        }
    }
}

function spawnBot() {
    const id = "bot-" + Math.random().toString(36).substr(2, 5);
    const bot = { id: id, mesh: createPlayerMesh(0xffeb3b, true), lastShoot: 0 };
    bot.mesh.position.copy(playerGroup.position);
    scene.add(bot.mesh);
    myBots.push(bot);
}

function toggleShop() { shopOpen = !shopOpen; document.getElementById('shop').style.display = shopOpen?'block':'none'; updateUI(); if(!shopOpen) renderer.domElement.requestPointerLock(); }
function buyArtifact(t) {
    if(t==='staff' && score>=50) { score-=50; hasStaff=true; showNotif("BÂTON ÉQUIPÉ"); }
    else if(t==='bot' && kills>=5) { kills-=5; spawnBot(); showNotif("DRONE DÉPLOYÉ"); }
    toggleShop();
}
function toggleInvis() {
    if(Date.now()-lastInvis < 15000) return;
    isInvisible=true; lastInvis=Date.now(); playerGroup.children.forEach(c => c.material.opacity = 0.2);
    setTimeout(() => { isInvisible=false; playerGroup.children.forEach(c => c.material.opacity = 1); }, 5000);
}
function updateUI() { 
    document.getElementById('myScore').textContent=score; 
    document.getElementById('myKills').textContent=kills; 
    document.getElementById('bot-item').className = kills>=5?'shop-item':'shop-item locked';
    document.getElementById('shop-points').textContent=score;
    document.getElementById('shop-kills').textContent=kills;
}
function showNotif(t) { const n=document.getElementById('notif'); n.textContent=t; setTimeout(()=>n.textContent="", 3000); }
function setupInputs() {
    window.onkeydown=(e)=>{ keysDown[e.code]=true; if(e.code==='KeyB') toggleShop(); if(e.code==='KeyE') toggleInvis(); };
    window.onkeyup=(e)=>keysDown[e.code]=false;
    document.onmousemove=(e)=>{ if(document.pointerLockElement) yaw-=e.movementX*0.003; };
    window.onmousedown=()=>{ if(!shopOpen) { renderer.domElement.requestPointerLock(); shoot(); } };
}
</script>
</body>
</html>
