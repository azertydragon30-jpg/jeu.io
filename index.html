<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - FULL GAME & AUTH</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-touch-callout: none; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; width: 100%; z-index: 10; }
        .hud-panel { background: rgba(0,0,0,0.6); padding: 10px; border-left: 4px solid #00d4ff; margin-bottom: 5px; backdrop-filter: blur(4px); display: inline-block; }
        #health-bar-bg { width: 200px; height: 15px; background: #333; margin-top: 5px; transform: skewX(-20deg); border: 1px solid #555; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.1s; }
        #ammo-box { position: fixed; bottom: 20px; right: 20px; font-size: 35px; font-weight: 900; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; z-index: 5; text-align: right; }
        #weapon-info { font-size: 14px; color: #fff; text-transform: uppercase; }
        
        #leaderboard { position: fixed; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); border: 1px solid #00d4ff; padding: 10px; width: 180px; font-family: monospace; z-index: 100; pointer-events: none; border-radius: 4px; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 14px; color: #00d4ff; border-bottom: 1px solid #00d4ff; padding-bottom: 5px; text-transform: uppercase; }
        .leader-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
        .is-me { color: #00d4ff; font-weight: bold; }

        #sniper-scope { position: fixed; inset: 0; border-radius: 50%; pointer-events: none; display: none; box-shadow: 0 0 0 1000px #000; border: 2px solid #555; background: radial-gradient(circle, transparent 30%, #000 80%); z-index: 20; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #00fff2; border-radius: 50%; pointer-events: none; box-shadow: 0 0 5px #00fff2; z-index: 21; }
        #hit-marker { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 24px; height: 24px; border: 3px solid #ff0055; opacity: 0; transition: opacity 0.1s; pointer-events: none; border-left: none; border-top: none; z-index: 22; }
        
        #reload-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #ff0055; font-weight: bold; display: none; text-shadow: 0 0 10px red; animation: blink 0.3s infinite; z-index: 25; }
        @keyframes blink { 50% { opacity: 0; } }
        
        #kill-feed { position: absolute; top: 150px; right: 20px; text-align: right; font-size: 14px; font-weight: bold; font-family: monospace; z-index: 10; }
        .kill-item { background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; margin-bottom: 2px; border-right: 3px solid #00d4ff; animation: fadeout 4s forwards; }
        @keyframes fadeout { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 500; background: radial-gradient(circle at center, #112 0%, #000 100%); }
        .box { background: rgba(20,20,30,0.9); padding: 50px; border: 1px solid #00d4ff; text-align: center; border-radius: 5px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); }
        #google-btn-container { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }

        #pause-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(8px); }
        .menu-box { background: #0a0a15; border: 2px solid #00d4ff; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
        .menu-btn { width: 250px; display: block; margin: 15px auto; padding: 15px; background: linear-gradient(45deg, #00d4ff, #0088aa); border: none; font-weight: 900; cursor: pointer; color: #000; text-transform: uppercase; }
        .menu-btn.red { background: linear-gradient(45deg, #ff0055, #aa0033); }

        #mobile-controls { display: none; position: absolute; inset: 0; z-index: 50; pointer-events: none; }
        .touch-zone { position: absolute; bottom: 50px; width: 150px; height: 150px; pointer-events: auto; }
        #stick-container { left: 30px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; background: rgba(0,0,0,0.2); }
        #stick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(0, 212, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 40; }
        .mob-btn { position: absolute; width: 70px; height: 70px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation; user-select: none; }
        #btn-fire { bottom: 60px; right: 40px; width: 90px; height: 90px; border-color: #ff0055; background: rgba(255,0,85,0.2); font-size: 40px; z-index: 60; }
        #btn-menu { top: 20px; left: 50%; transform: translateX(-50%); width: 100px; height: 40px; border-radius: 5px; font-size: 14px; border-color: #00d4ff; pointer-events: auto; }
        
        #user-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        #user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #00d4ff; display: none; }
        #user-name { font-weight: bold; color: #00d4ff; }
        
        #admin-console { position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); border: 1px solid #ff0055; padding: 5px; z-index: 1000; display: none; }
        #admin-input { background: #000; border: 1px solid #ff0055; color: #0f0; width: 350px; font-family: monospace; outline: none; padding: 5px; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h1>NEON <span style="color:#00d4ff">STRIKE</span></h1>
        <p style="color:#888; margin-bottom:20px;">CONNEXION GOOGLE OU INVITE</p>
        <div id="google-btn-container">
            <div id="g_id_onload"
                 data-client_id="467950217263-7beh6tsp5nto8f2e1qpea0rsmgnlfr49.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>
            
            <button onclick="guestLogin()" style="background:transparent; border:1px solid #444; color:#888; padding:10px 20px; cursor:pointer; font-size:12px; margin-top:10px;">CONTINUER EN TANT QU'INVITÉ</button>
        </div>
    </div>
</div>

<div id="pause-menu">
    <div class="menu-box">
        <h2>PAUSE</h2>
        <button class="menu-btn" onclick="togglePause()">REPRENDRE</button>
        <button class="menu-btn" onclick="alert('Z/Q/S/D: Bouger\nEspace: Sauter\nShift: Dash\nClic Droit: Zoom Sniper\nF2: Admin')">COMMANDES</button>
        <button class="menu-btn red" onclick="location.reload()">DÉCONNEXION</button>
    </div>
</div>

<div id="ui">
    <div class="hud-panel">
        <div id="user-profile">
            <img id="user-avatar" src="" alt="">
            <span id="user-name">Soldat</span>
        </div>
        <div style="font-size:24px; font-weight:bold;">SCORE: <span id="score">0</span></div>
    </div><br>
    <div class="hud-panel"><div>SANTÉ</div><div id="health-bar-bg"><div id="health-bar"></div></div></div>
</div>

<div id="leaderboard">
    <h3>Classement</h3>
    <div id="leaderboard-list"></div>
</div>

<div id="ammo-box">
    <div id="weapon-info">MITRAILLETTE</div>
    <span id="ammo-val">--</span> / <span id="ammo-max">--</span>
</div>
<div id="reload-msg">RECHARGEMENT...</div>
<div id="kill-feed"></div>
<div id="crosshair"></div>
<div id="sniper-scope"></div>
<div id="hit-marker"></div>

<div id="admin-console"><input type="text" id="admin-input"></div>

<div id="mobile-controls">
    <div id="stick-container" class="touch-zone"><div id="stick"></div></div>
    <div id="look-zone"></div>
    <div id="btn-fire" class="mob-btn">🔥</div>
    <div id="btn-jump" class="mob-btn">⬆️</div>
    <div id="btn-dash" class="mob-btn">⚡</div>
    <div id="btn-scope" class="mob-btn">🎯</div>
    <div id="btn-swap" class="mob-btn">SWAP</div>
    <div id="btn-menu" class="mob-btn" onclick="togglePause()">MENU</div>
</div>

<div id="btn-invoke" class="mob-btn" onclick="invokeBot()" style="display:none; position:fixed; bottom:20px; left:20px; z-index:60; border-color:#ffaa00; background:rgba(255,170,0,0.2); color:#ffaa00;">🤖</div>

<script>
const KEYS_CONFIG = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0, pitch = 0;
let ably, channel, myID, myName = "Invité", myAvatar = "";
let otherPlayers = {}, bullets = [], walls = [], bots = [], jumpPads = [];
let keysDown = {}, hp = 100, score = 0, lastShoot = 0, lastDash = 0, lastSync = 0, isReloading = false, isSniper = false, dashPower = 0, isPaused = false;
let audioCtx, vy = 0, currentGravity = -55, currentJumpForce = 24, jumpCount = 0, playerSpeedBase = 32;
let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);
let touchMove = { x: 0, y: 0 }, isFiring = false, adminMode = false, adminEnabledByConsole = false;

function handleCredentialResponse(response) {
    try {
        const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        myName = payload.name;
        myAvatar = payload.picture;
        myID = "G-" + payload.sub.substring(0,8);
        document.getElementById('user-name').textContent = myName;
        const avatarImg = document.getElementById('user-avatar');
        avatarImg.src = myAvatar; avatarImg.style.display = 'block';
        connectToCloud();
    } catch(e) { guestLogin(); }
}

function guestLogin() {
    myID = "Guest-" + Math.floor(Math.random()*999);
    myName = "Anonyme-" + myID.split('-')[1];
    document.getElementById('user-name').textContent = myName;
    connectToCloud();
}

async function connectToCloud() {
    initAudio(); 
    try {
        ably = new Ably.Realtime({ key: KEYS_CONFIG[0], clientId: myID });
        ably.connection.on('connected', async () => {
            channel = ably.channels.get('neon-elite');
            channel.subscribe('p', handleMessage);
            channel.presence.subscribe('leave', m => removeRemote(m.clientId));
            await channel.presence.enter();
            initGame();
            document.getElementById('login').style.display = 'none';
        });
    } catch (e) { alert("Erreur Ably."); }
}

function handleMessage(m) {
    if (m.data.o === myID) return;
    const d = m.data;
    if (d.t === 'm') updateRemote(d);
    else if (d.t === 'f') { createBullet(d); playSound('laser', 0.1); }
    else if (d.t === 'h' && d.tgt === myID) { takeDamage(d.dmg, d.o); playSound('hit', 0.5); }
    else if (d.t === 'k') addKillFeed(d.killer, d.victim);
}

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playSound(type, vol=0.1) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type==='shoot'?'square':'sawtooth';
    osc.frequency.setValueAtTime(type==='shoot'?150:800, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.1);
    osc.start(); osc.stop(audioCtx.currentTime+0.1);
}

const WEAPONS = [
    { name: "Mitraillette", ammo: 50, maxAmmo: 50, rate: 80, dmg: 6, speed: 200, color: 0xff00cc, spread: 0.05, count: 1, size: 0.6 },
    { name: "Fusil d'Assaut", ammo: 30, maxAmmo: 30, rate: 120, dmg: 12, speed: 180, color: 0x00ffcc, spread: 0, count: 1, size: 1 },
    { name: "Railgun Sniper", ammo: 5, maxAmmo: 5, rate: 1000, dmg: 85, speed: 400, color: 0xff00ff, spread: 0, count: 1, size: 1.2 }
];
let currentWeaponIdx = 0;

function initGame() {
    scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050a15, 0.005);
    camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 2000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    buildMap();
    playerGroup = createPlayerMesh(0x00d4ff, false); playerGroup.position.set(0, 15, 0); scene.add(playerGroup);
    for(let i=0; i<4; i++) spawnBot();
    switchWeapon(0); setupInputs();
    if(isMobile) { document.getElementById('mobile-controls').style.display = 'block'; setupTouchControls(); }
    document.getElementById('btn-invoke').style.display = 'flex';
    loop();
}

function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
    if(!isPaused && !isMobile) renderer.domElement.requestPointerLock();
    else if(isPaused) document.exitPointerLock();
}

function createPlayerMesh(col, withHb = true) {
    const g = new THREE.Group();
    const m = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.5 });
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), m); b.position.y = 0.9;
    g.add(b);
    if (withHb) {
        const hbg = new THREE.Group();
        const f = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.2), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
        hbg.add(f); hbg.position.y = 2.8; g.add(hbg); g.healthBar = f; g.healthBarGroup = hbg;
    }
    return g;
}

function buildMap() {
    const grid = new THREE.GridHelper(2000, 200, 0x003366, 0x001122); scene.add(grid);
    createWall(0, -1, 0, 2000, 2000, 1, 0x050a15);
    createWall(0, 0, 0, 60, 60, 1, 0x00d4ff);
    const tDist = 120;
    [[tDist, tDist], [-tDist, tDist], [tDist, -tDist], [-tDist, -tDist]].forEach(pos => {
        createWall(pos[0], 0, pos[1], 15, 15, 40, 0x00ffcc);
        createWall(pos[0], 40, pos[1], 25, 25, 1, 0xffffff);
        createJumpPad(pos[0]+12, 0, pos[1]);
    });
}

function createWall(x, y, z, w, d, h, color) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color })); 
    m.position.set(x, y + h/2, z); scene.add(m);
    walls.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y, maxY: y+h });
}

function createJumpPad(x, y, z) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.5, 16), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
    m.position.set(x, y + 0.25, z); scene.add(m);
    jumpPads.push({ x, z, y, radius: 4 });
}

function spawnBot() {
    const bot = { id: "Bot-" + Math.floor(Math.random()*1000), mesh: createPlayerMesh(0xffff00, true), hp: 80, maxHp: 80, vy: 0, lastShoot: 0, dir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize(), changeDirAt: 0 };
    bot.mesh.position.set((Math.random()-0.5)*150, 20, (Math.random()-0.5)*150); scene.add(bot.mesh); bots.push(bot);
}

function invokeBot() { if(score >= 500) { score -= 500; spawnBot(); } }

function loop() {
    requestAnimationFrame(loop);
    const now = Date.now(), dt = 0.016;
    if(!isPaused) {
        if(isFiring) shoot();
        let moveSpeed = playerSpeedBase + dashPower; dashPower *= 0.9;
        const move = new THREE.Vector3();
        if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
        if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
        if(move.length() > 0) {
            let s = move.clone().normalize().multiplyScalar(moveSpeed * dt);
            playerGroup.position.x += s.x; playerGroup.position.z += s.z;
        }
        vy += currentGravity * dt; playerGroup.position.y += vy * dt;
        if(playerGroup.position.y < 0) { playerGroup.position.y = 0; vy = 0; jumpCount = 0; }
        
        jumpPads.forEach(pad => {
            if(playerGroup.position.distanceTo(new THREE.Vector3(pad.x, playerGroup.position.y, pad.z)) < 4) vy = 60;
        });

        bots.forEach(bot => {
            bot.mesh.position.x += bot.dir.x * 5 * dt; bot.mesh.position.z += bot.dir.z * 5 * dt;
            if(bot.mesh.healthBarGroup) bot.mesh.healthBarGroup.lookAt(camera.position);
            if(now - bot.lastShoot > 2000) { bot.lastShoot = now; shootBot(bot); }
        });

        for(let i=bullets.length-1; i>=0; i--) {
            const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * dt);
            if(b.o === myID) {
                bots.forEach((bot, idx) => {
                    if(b.mesh.position.distanceTo(bot.mesh.position) < 2) {
                        bot.hp -= b.dmg; triggerHitMarker(); scene.remove(b.mesh); bullets.splice(i,1);
                        if(bot.hp <= 0) { addKillFeed(myName, "Bot"); scene.remove(bot.mesh); bots.splice(idx,1); }
                    }
                });
            }
        }
        if(now - lastSync > 50) { channel.publish('p', { t:'m', o:myID, name:myName, x:playerGroup.position.x, y:playerGroup.position.y, z:playerGroup.position.z, ry:yaw, score, hp }); lastSync = now; updateLeaderboard(); document.getElementById('score').textContent = score; }
    }
    camera.position.lerp(new THREE.Vector3(playerGroup.position.x - Math.sin(yaw)*13, playerGroup.position.y + 8, playerGroup.position.z - Math.cos(yaw)*13), 0.2);
    camera.lookAt(playerGroup.position.x, playerGroup.position.y + 4, playerGroup.position.z);
    renderer.render(scene, camera);
}

function shoot() {
    const w = WEAPONS[currentWeaponIdx]; if(isReloading || Date.now() - lastShoot < w.rate) return;
    lastShoot = Date.now(); w.ammo--; document.getElementById('ammo-val').textContent = w.ammo;
    if(w.ammo <= 0) reload();
    const d = { t:'f', o:myID, x:playerGroup.position.x, y:playerGroup.position.y+1.8, z:playerGroup.position.z, dx:Math.sin(yaw), dy:0, dz:Math.cos(yaw), spd:w.speed, dmg:w.dmg, col:w.color, sz:w.size };
    channel.publish('p', d); createBullet(d); playSound('shoot');
}

function shootBot(bot) {
    const dir = playerGroup.position.clone().sub(bot.mesh.position).normalize();
    createBullet({ t:'f', o:bot.id, x:bot.mesh.position.x, y:bot.mesh.position.y+1.5, z:bot.mesh.position.z, dx:dir.x, dy:dir.y, dz:dir.z, spd:100, dmg:10, col:0xffff00, sz:1 });
}

function takeDamage(d, id) { hp -= d; document.getElementById('health-bar').style.width = hp + "%"; if(hp <= 0) { hp = 100; playerGroup.position.set(0, 15, 0); } }
function createBullet(d) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshBasicMaterial({color:d.col})); m.position.set(d.x,d.y,d.z); scene.add(m); bullets.push({mesh:m, dir:new THREE.Vector3(d.dx,d.dy,d.dz), speed:d.spd, dmg:d.dmg, o:d.o}); }
function jump() { if(jumpCount < 2) { vy = currentJumpForce; jumpCount++; } }
function switchWeapon(i) { currentWeaponIdx=i; document.getElementById('weapon-info').textContent=WEAPONS[i].name; document.getElementById('ammo-val').textContent=WEAPONS[i].ammo; document.getElementById('ammo-max').textContent=WEAPONS[i].maxAmmo; }
function reload() { if(isReloading) return; isReloading = true; document.getElementById('reload-msg').style.display = 'block'; setTimeout(() => { WEAPONS[currentWeaponIdx].ammo = WEAPONS[currentWeaponIdx].maxAmmo; document.getElementById('ammo-val').textContent = WEAPONS[currentWeaponIdx].ammo; isReloading = false; document.getElementById('reload-msg').style.display = 'none'; }, 1500); }
function triggerHitMarker() { const hm = document.getElementById('hit-marker'); hm.style.opacity = 1; setTimeout(() => hm.style.opacity = 0, 100); }
function addKillFeed(k,v) { const d=document.createElement('div'); d.className='kill-item'; d.textContent=`${k} > ${v}`; document.getElementById('kill-feed').prepend(d); if(k===myName) score+=100; }
function updateLeaderboard() { let p = [{id:myName, s:score, me:true}]; for(let id in otherPlayers) p.push({id:otherPlayers[id].name, s:otherPlayers[id].score, me:false}); p.sort((a,b)=>b.s-a.s); document.getElementById('leaderboard-list').innerHTML = p.map(x=>`<div class="${x.me?'is-me':''}">${x.id}: ${x.s}</div>`).join(''); }
function updateRemote(d) { if(!otherPlayers[d.o]){ otherPlayers[d.o]={mesh:createPlayerMesh(0xff0055, true), score:0, name:d.name}; scene.add(otherPlayers[d.o].mesh); } otherPlayers[d.o].mesh.position.set(d.x,d.y,d.z); otherPlayers[d.o].score = d.score; }
function removeRemote(id) { if(otherPlayers[id]){ scene.remove(otherPlayers[id].mesh); delete otherPlayers[id]; } }

function setupInputs() {
    window.onkeydown=e=>{ if(e.code==='Escape') togglePause(); if(isPaused) return; keysDown[e.code]=true; if(e.code==='Space') jump(); if(e.code==='KeyR') reload(); if(e.code.startsWith('Digit')) switchWeapon(parseInt(e.code.slice(-1))-1); };
    window.onkeyup=e=>keysDown[e.code]=false;
    document.onmousemove=e=>{ if(document.pointerLockElement && !isPaused) yaw -= e.movementX * 0.003; };
    window.onmousedown=e=>{ if(!isPaused && !isMobile) { if(document.pointerLockElement) isFiring=true; else renderer.domElement.requestPointerLock(); } };
    window.onmouseup=e=>isFiring=false;
}

function setupTouchControls() {
    document.getElementById('btn-fire').ontouchstart=()=>isFiring=true;
    document.getElementById('btn-fire').ontouchend=()=>isFiring=false;
    document.getElementById('btn-jump').ontouchstart=jump;
    document.getElementById('btn-swap').ontouchstart=()=>switchWeapon((currentWeaponIdx+1)%WEAPONS.length);
}
</script>
</body>
</html>
