<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Strike - Classic Human</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Courier New', monospace; user-select: none; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #00d4ff; border-radius: 8px; z-index: 10; pointer-events: none; }
        #health-bar-container { width: 150px; height: 10px; background: #333; border: 1px solid #fff; margin-top: 5px; }
        #health-bar { width: 100%; height: 100%; background: #ff0055; transition: width 0.3s; }
        #login { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .box { background: #111; padding: 30px; border: 3px solid #00d4ff; border-radius: 15px; text-align: center; }
        button { padding: 12px 30px; cursor: pointer; background: #00d4ff; border: none; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="login">
    <div class="box">
        <h1 style="color:#00d4ff">NEON STRIKE</h1>
        <button onclick="connectToCloud()">REJOINDRE L'ARÈNE</button>
    </div>
</div>

<div id="ui">
    <div>SCORE: <span id="myScore">0</span></div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
    <div style="margin-top:5px; font-size:10px; color:#00d4ff">ZQSD pour bouger | CLIC pour tirer</div>
</div>

<script>
const KEYS = ['hoXqWQ.xS6MJA:4jw_S7dp30pIrB7Sm3tCM6S4WQa57PAqkPdp-WN-Ros'];
let scene, camera, renderer, playerGroup, yaw = 0;
let ably, channel, myID, otherPlayers = {}, bullets = [], walls = [], keysDown = {};
let hp = 100, score = 0, lastShoot = 0, lastSync = 0;

async function connectToCloud() {
    myID = "Ghost-" + Math.random().toString(36).substr(2, 3).toUpperCase();
    try {
        ably = new Ably.Realtime({ key: KEYS[0], clientId: myID });
        channel = ably.channels.get('neon-classic');
        channel.subscribe('p', (m) => {
            if (m.data.o === myID) return;
            if (m.data.t === 'm') updateRemote(m.data);
            if (m.data.t === 'f') createBullet(m.data);
            if (m.data.t === 'h' && m.data.tgt === myID) takeDamage(m.data.dmg);
        });
        await channel.presence.enter();
        initGame();
        document.getElementById('login').style.display = 'none';
    } catch (e) { alert("Erreur de connexion"); }
}

function createPlayerMesh(col) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.3 });
    
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat); head.position.y = 2.6;
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), mat); torso.position.y = 1.8;
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), mat); armL.position.set(-0.55, 1.8, 0);
    const armR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), mat); armR.position.set(0.55, 1.8, 0);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.1, 0.3), mat); legL.position.set(-0.25, 0.6, 0);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.1, 0.3), mat); legR.position.set(0.25, 0.6, 0);

    group.add(head, torso, armL, armR, legL, legR);
    return group;
}

function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.GridHelper(400, 80, 0x00d4ff, 0x111111));
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    playerGroup = createPlayerMesh(0x00d4ff);
    scene.add(playerGroup);
    setupInputs();
    loop();
}

function updateRemote(d) {
    if(!otherPlayers[d.o]) {
        otherPlayers[d.o] = { mesh: createPlayerMesh(0xff0055) };
        scene.add(otherPlayers[d.o].mesh);
    }
    otherPlayers[d.o].mesh.position.set(d.x, 0, d.z);
    otherPlayers[d.o].mesh.rotation.y = d.y;
}

function loop() {
    requestAnimationFrame(loop);
    const now = Date.now(), dt = 0.016;

    const move = new THREE.Vector3();
    if(keysDown['KeyW']) move.add(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyS']) move.sub(new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw)));
    if(keysDown['KeyA']) move.add(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));
    if(keysDown['KeyD']) move.sub(new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)));

    if(move.length() > 0) {
        playerGroup.position.add(move.normalize().multiplyScalar(35 * dt));
        playerGroup.children[2].rotation.x = Math.sin(now * 0.01) * 0.5;
        playerGroup.children[3].rotation.x = -Math.sin(now * 0.01) * 0.5;
    }
    playerGroup.rotation.y = yaw;

    if(now - lastSync > 100) {
        channel.publish('p', { t:'m', o:myID, x:playerGroup.position.x, z:playerGroup.position.z, y:yaw });
        lastSync = now;
    }

    for(let i=bullets.length-1; i>=0; i--) {
        const b = bullets[i]; b.mesh.position.addScaledVector(b.dir, b.speed * dt);
        if(b.o === myID) {
            for(let id in otherPlayers) {
                if(b.mesh.position.distanceTo(otherPlayers[id].mesh.position) < 2.5) {
                    channel.publish('p', { t:'h', o:myID, tgt:id, dmg:20 });
                    score += 10; document.getElementById('myScore').textContent = score;
                    scene.remove(b.mesh); bullets.splice(i,1); break;
                }
            }
        }
        if(bullets[i] && now > b.death) { scene.remove(b.mesh); bullets.splice(i,1); }
    }

    camera.position.set(playerGroup.position.x - Math.sin(yaw)*15, 10, playerGroup.position.z - Math.cos(yaw)*15);
    camera.lookAt(playerGroup.position);
    renderer.render(scene, camera);
}

function shoot() {
    if(Date.now() - lastShoot < 250) return;
    lastShoot = Date.now();
    const d = { t:'f', o:myID, x:playerGroup.position.x, y:1.8, z:playerGroup.position.z, dx:Math.sin(yaw), dz:Math.cos(yaw), spd:100, col:0x00ff00 };
    channel.publish('p', d);
    createBullet(d);
}

function createBullet(d) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: d.col }));
    m.position.set(d.x, d.y, d.z); scene.add(m);
    bullets.push({ mesh:m, dir:new THREE.Vector3(d.dx,0,d.dz), speed:d.spd, o:d.o, death:Date.now()+2000 });
}

function takeDamage(dmg) {
    hp -= dmg; document.getElementById('health-bar').style.width = Math.max(0, hp) + "%";
    if(hp <= 0) { hp = 100; playerGroup.position.set(Math.random()*40-20, 0, Math.random()*40-20); }
}

function setupInputs() {
    window.onkeydown = (e) => keysDown[e.code] = true;
    window.onkeyup = (e) => keysDown[e.code] = false;
    document.onmousemove = (e) => { if(document.pointerLockElement) yaw -= e.movementX * 0.003; };
    window.onmousedown = () => { if(document.pointerLockElement) shoot(); else renderer.domElement.requestPointerLock(); };
}
</script>
</body>
</html>
